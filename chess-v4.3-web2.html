                    }
                }
            }

            calculateEndgame() {
                let circleKill = 0, crossKill = 0, circleResources = 0, crossResources = 0, circleSubCityScore = 0, crossSubCityScore = 0;
                for (let y = 0; y < gameConfig.size; y++) {
                    for (let x = 0; x < gameConfig.size; x++) {
                        if (this.game.state.state[y][x].type !== 'mix' && this.game.state.state[y][x].type !== 'resource') continue;
                        let circle = 0, cross = 0;
                        for (const [dx, dy] of OFFSETS_3x3) {
                            const nx = x + dx, ny = y + dy;
                            if (nx < 0 || nx >= gameConfig.size || ny < 0 || ny >= gameConfig.size) continue;
                            const type = this.game.state.state[ny][nx].type;
                            if (type === 'circle') circle++; else if (type === 'cross') cross++;
                        }
                        if (circle > cross) this.game.state.state[y][x].type === 'mix' ? circleKill++ : circleResources++;
                        else if (cross > circle) this.game.state.state[y][x].type === 'mix' ? crossKill++ : crossResources++;
                    }
                }
                const subAreaOffset = Math.floor(SUB_CITY_AREA / 2);
                this.game.state.subCities.forEach(subCity => {
                    if (!subCity.lost) {
                        const owner = subCity.owner;
                        let friendlyCount = 0;
                        for (let dy = -subAreaOffset; dy <= subAreaOffset; dy++) {
                            for (let dx = -subAreaOffset; dx <= subAreaOffset; dx++) {
                                const nx = subCity.x + dx, ny = subCity.y + dy;
                                if (nx < 0 || nx >= gameConfig.size || ny < 0 || ny >= gameConfig.size) continue;
                                const type = this.game.state.state[ny][nx].type;
                                if ((owner === 'circle' && type === 'circle') || (owner === 'cross' && type === 'cross')) friendlyCount++;
                            }
                        }
                        if (owner === 'circle') circleSubCityScore += friendlyCount; else crossSubCityScore += friendlyCount;
                    }
                });
                this.game.stats = { ...this.game.stats, circleKill, crossKill, circleResources, crossResources, circleSubCityScore, crossSubCityScore };
                this.game.domCache.get('circleKill').textContent = `◯ ${circleKill}`;
                this.game.domCache.get('crossKill').textContent = `✕ ${crossKill}`;
                this.game.domCache.get('circleResources').textContent = `◯ ${circleResources}`;
                this.game.domCache.get('crossResources').textContent = `✕ ${crossResources}`;
                this.game.domCache.get('circleSubcity').textContent = `◯ ${circleSubCityScore}`;
                this.game.domCache.get('crossSubcity').textContent = `✕ ${crossSubCityScore}`;
                const circleTotal = circleKill + circleResources + circleSubCityScore;
                const crossTotal = crossKill + crossResources + crossSubCityScore;
                const circleMainCityLost = this.game.state.mainCities.some(city => city.owner === 'circle' && city.lost);
                const crossMainCityLost = this.game.state.mainCities.some(city => city.owner === 'cross' && city.lost);
                let winner = '';
                if (!circleMainCityLost && crossMainCityLost) winner = `◯ 方胜利`;
                else if (circleMainCityLost && !crossMainCityLost) winner = `✕ 方胜利`;
                else if (circleTotal > crossTotal) winner = `◯ 方胜利(${circleTotal}:${crossTotal})`;
                else if (crossTotal > circleTotal) winner = `✕ 方胜利(${crossTotal}:${circleTotal})`;
                else winner = `平局(${circleTotal}:${crossTotal})`;
                this.game.domCache.get('winnerText').textContent = winner;
            }
        }

        // 状态管理类
        class Status {
            constructor(game) {
                this.game = game;
                this.domCache = game.domCache;
                this.flashQueue = [];
                this.flashSchedulerTimer = null;
                this.lastScheduledExpiry = 0;
            }

            updateDisplay(saveHistoryFlag = true) {
                const actionMap = { 'x-main': '建✕主城', 'o-main': '建◯主城', 'x-sub': '建副城', 'o-sub': '建副城', 'choose': '选先手', 'x-lay': '✕方置子', 'o-lay': '◯方置子', 'x-game': '✕方', 'o-game': '◯方' };
                let circle = 0, cross = 0, mix = 0;
                for (let y = 0; y < gameConfig.size; y++) {
                    for (let x = 0; x < gameConfig.size; x++) {
                        switch (this.game.state.state[y][x].type) { case 'circle': circle++; break; case 'cross': cross++; break; case 'mix': mix++; break; }
                    }
                }
                this.game.stats = { ...this.game.stats, circle, cross, mix };
                if (saveHistoryFlag) {
                    this.domCache.get('currentAction').textContent = actionMap[this.game.state.buildPhase] || '';
                    const mainCross = this.game.state.mainCities.filter(city => city.owner === 'cross' && !city.attacked).length;
                    const mainCircle = this.game.state.mainCities.filter(city => city.owner === 'circle' && !city.attacked).length;
                    const subCircle = this.game.state.subCities.filter(city => city.occupied === 'circle' && !city.lost).length;
                    const subCross = this.game.state.subCities.filter(city => city.occupied === 'cross' && !city.lost).length;
                    this.domCache.get('circleCount').textContent = `◯ ${circle}`;
                    this.domCache.get('crossCount').textContent = `✕ ${cross}`;
                    this.domCache.get('mixCount').textContent = `⨂ ${mix}`;
                    this.domCache.get('mainCircleCount').textContent = `◯ ${mainCircle}`;
                    this.domCache.get('mainCrossCount').textContent = `✕ ${mainCross}`;
                    this.domCache.get('subCircleCount').textContent = `◯ ${subCircle}`;
                    this.domCache.get('subCrossCount').textContent = `✕ ${subCross}`;
                    this.domCache.get('undoBtn').disabled = this.game.state.history.length <= 1;
                    this.domCache.get('gameStatus').textContent = this.game.network.isMyTurn ? '轮到你' : '等待对手';
                }
            }

            saveHistory(action) {
                this.game.state.history.push(action);
                try {
                    const elList = document.getElementById('history-list');
                    if (elList) {
                        const index = this.game.state.history.length - 1;
                        const text = this.formatHistoryEntry(action, index);
                        const item = document.createElement('div');
                        item.textContent = `${index}. ${text}`;
                        item.style.padding = '6px 8px';
                        item.style.borderBottom = '1px solid #eee';
                        item.style.cursor = 'pointer';
                        item.dataset.index = index;
                        item.addEventListener('click', (e) => this.handleHistoryItemClick(e));
                        elList.insertBefore(item, elList.firstChild);
                        elList.scrollTop = 0;
                    }
                } catch (e) { console.error('记录棋局日志失败', e); }
            }

            handleHistoryItemClick(e) {
                const item = e.target;
                const index = parseInt(item.dataset.index);
                if (isNaN(index)) return;
                const action = this.game.state.history[index];
                if (action && action.fromX !== undefined && action.fromY !== undefined) this.flashCell(action.fromX, action.fromY, 'rgba(128, 200, 255, 0.8)', 3000);
                if (action && action.x !== undefined && action.y !== undefined) {
                    if (action.opt === 'x-place' || action.opt === 'o-place') this.flashCell(action.x, action.y, 'rgba(100, 200, 100, 0.5)', 3000);
                    else if (action.opt === 'x-eat' || action.opt === 'o-eat') this.flashCell(action.x, action.y, 'rgba(255, 204, 199, 0.8)', 3000);
                    else this.flashCell(action.x, action.y, 'rgba(100, 200, 100, 0.5)', 3000);
                }
            }

            formatHistoryEntry(action, idx) {
                if (!action || !action.opt) return '未知操作';
                const opt = action.opt, x = action.x, y = action.y;
                switch (opt) {
                    case 'mainX': return `在(${x}, ${y})建✕主城`; case 'mainO': return `在(${x}, ${y})建◯主城`;
                    case 'subX': return `在(${x}, ${y})建✕副城`; case 'subO': return `在(${x}, ${y})建◯副城`;
                    case 'random': { let parts = ['随机地图']; if (action.mainCities) parts.push(`主城:${action.mainCities.length}`); if (action.subCities) parts.push(`副城:${action.subCities.length}`); return parts.join(' | '); }
                    case 'layX': return `✕ 在(${x}, ${y})布子`; case 'layO': return `◯ 在(${x}, ${y})布子`;
                    case 'choose': return `先手选择 ${action.player || action.firstPlayer || ''} 方`;
                    case 'x-place': return `✕ 方走子到(${x}, ${y})`; case 'o-place': return `◯ 方走子到(${x}, ${y})`;
                    case 'x-eat': return `✕ 方吃子于(${x}, ${y})`; case 'o-eat': return `◯ 方吃子于(${x}, ${y})`;
                    case 'select': return `选中(${x}, ${y})`;
                    case 'undo': return `请求悔棋`; case 'restart': return `请求重新开局`; case 'calculate': return `请求结算胜负`; case 'export': return `请求导出棋局`;
                    default: return `${opt} ${x !== undefined && y !== undefined ? `(${x}, ${y})` : ''}`;
                }
            }

            renderFullHistory() {
                const elList = document.getElementById('history-list');
                if (!elList) return;
                elList.innerHTML = '';
                for (let i = this.game.state.history.length - 1; i >= 0; i--) {
                    const action = this.game.state.history[i];
                    const text = this.formatHistoryEntry(action, i);
                    const item = document.createElement('div');
                    item.textContent = `${i}. ${text}`;
                    item.style.padding = '6px 8px';
                    item.style.borderBottom = '1px solid #eee';
                    item.style.cursor = 'pointer';
                    item.dataset.index = i;
                    item.addEventListener('click', (e) => this.handleHistoryItemClick(e));
                    elList.appendChild(item);
                }
                elList.scrollTop = 0;
            }

            clearFlashQueue() {
                this.flashQueue = [];
                if (this.flashSchedulerTimer) { clearTimeout(this.flashSchedulerTimer); this.flashSchedulerTimer = null; }
                this.lastScheduledExpiry = 0;
                requestAnimationFrame(() => this.game.board.drawBoard());
            }

            flashCell(x, y, color = 'rgba(0,200,0,0.45)', duration = 2000) {
                if (x < 0 || y < 0 || x >= gameConfig.size || y >= gameConfig.size) return;
                const now = Date.now();
                const desiredExpiry = now + duration;
                const expiry = Math.max(desiredExpiry, this.lastScheduledExpiry + 1);
                this.lastScheduledExpiry = expiry;
                const entry = { id: `${now}_${Math.random()}`, x, y, color, expiry };
                this.flashQueue.push(entry);
                requestAnimationFrame(() => this.game.board.drawBoard());
                if (!this.flashSchedulerTimer && this.flashQueue.length > 0) {
                    const processQueue = () => {
                        this.flashSchedulerTimer = null;
                        const now = Date.now();
                        let removed = false;
                        while (this.flashQueue.length && this.flashQueue[0].expiry <= now) { this.flashQueue.shift(); removed = true; }
                        if (removed) requestAnimationFrame(() => this.game.board.drawBoard());
                        if (this.flashQueue.length > 0) {
                            const nextExpiry = this.flashQueue[0].expiry;
                            const delay = Math.max(0, nextExpiry - now);
                            this.flashSchedulerTimer = setTimeout(processQueue, delay + 1);
                        } else { this.lastScheduledExpiry = 0; }
                    };
                    const nextExpiry = this.flashQueue[0].expiry;
                    const delay = Math.max(0, nextExpiry - now);
                    this.flashSchedulerTimer = setTimeout(processQueue, delay + 1);
                }
            }

            drawFlashesOverlay() {
                if (!this.flashQueue || this.flashQueue.length === 0) return;
                const ctx = this.domCache.get('ctx');
                const baseCellSize = gameConfig.cell, gapSize = 1;
                const now = Date.now();
                for (const e of this.flashQueue) {
                    if (e.expiry <= now) continue;
                    if (e.x < 0 || e.y < 0 || e.x >= gameConfig.size || e.y >= gameConfig.size) continue;
                    const cellX = e.x * (baseCellSize + gapSize), cellY = e.y * (baseCellSize + gapSize);
                    ctx.save();
                    ctx.fillStyle = e.color || 'rgba(0,200,0,0.45)';
                    ctx.fillRect(cellX, cellY, baseCellSize, baseCellSize);
                    ctx.restore();
                }
            }
        }

        // 网络通信类
        class Network {
            constructor(game) {
                this.game = game;
                this.domCache = game.domCache;
                this.ws = null;
                this.isNetworkGame = false;
                this.playerRole = null;
                this.isMyTurn = false;
            }

            connectToServer() {
                if (this.ws) { alert('已经连接到服务器'); return; }
                try {
                    const serverIp = this.domCache.get('serverIpInput').value.trim() || 'localhost';
                    const serverUrl = `ws://${serverIp}:8080`;
                    this.ws = new WebSocket(serverUrl);
                    this.ws.onopen = () => { console.log('WebSocket连接已建立'); this.domCache.get('connectionStatus').textContent = '已连接'; this.domCache.get('connectionStatus').style.color = '#4CAF50'; };
                    this.ws.onmessage = (event) => { try { const data = JSON.parse(event.data); this.handleWebSocketMessage(data); } catch (error) { console.error('消息解析错误:', error); } };
                    this.ws.onclose = () => { console.log('WebSocket连接已关闭'); this.domCache.get('connectionStatus').textContent = '未连接'; this.domCache.get('connectionStatus').style.color = '#f44336'; this.ws = null; };
                    this.ws.onerror = (error) => { console.error('WebSocket错误:', error); this.domCache.get('connectionStatus').textContent = '连接错误'; this.domCache.get('connectionStatus').style.color = '#f44336'; };
                } catch (error) { console.error('WebSocket连接失败:', error); this.domCache.get('connectionStatus').textContent = '连接失败'; this.domCache.get('connectionStatus').style.color = '#f44336'; }
            }

            disconnectServer() {
                if (this.ws) {
                    this.ws.close(); this.ws = null;
                    this.domCache.get('connectionStatus').textContent = '未连接'; this.domCache.get('connectionStatus').style.color = '#f44336';
                    this.domCache.get('playerRole').textContent = '未分配'; this.domCache.get('gameStatus').textContent = '准备中';
                    this.isNetworkGame = false; this.playerRole = null; this.isMyTurn = false;
                    alert('已断开服务器连接');
                } else { alert('未连接到服务器'); }
            }

            createRoom() { this.connectToServer(); if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify({ type: 'create_room' })); } else { alert('请先连接服务器'); } }
            joinRoom() { const roomId = this.domCache.get('roomIdInput').value.trim(); if (!roomId) { alert('请输入房间ID'); return; } this.connectToServer(); if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify({ type: 'join_room', roomId: roomId })); } else { alert('请先连接服务器'); } }

            sendGameAction(action) { if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify({ type: 'game_action', action: action })); } }

            handleWebSocketMessage(data) {
                console.log('收到WebSocket消息:', data.type); console.log('消息内容:', data);
                switch (data.type) {
                    case 'room_created': this.handleRoomCreated(data); break; case 'room_joined': this.handleRoomJoined(data); break;
                    case 'player_joined': this.handlePlayerJoined(data); break; case 'game_start': this.handleGameStart(data); break;
                    case 'game_continue': this.handleGameContinue(data); break; case 'game_action': this.handleGameAction(data); break;
                    case 'sync_request': this.handleSyncRequest(data); break; case 'sync_state': this.handleSyncState(data); break;
                    case 'player_left': this.handlePlayerLeft(data); break; case 'error': this.handleError(data); break;
                    default: console.log('未知消息类型:', data.type);
                }
            }

            handleRoomCreated(data) { this.domCache.get('roomIdInput').value = data.roomId; this.domCache.get('gameStatus').textContent = '等待对手加入'; alert(`房间创建成功！房间ID: ${data.roomId}`); }
            handleRoomJoined(data) { this.domCache.get('gameStatus').textContent = '游戏准备中'; alert('加入房间成功！游戏即将开始'); }
            handlePlayerJoined(data) { this.domCache.get('gameStatus').textContent = '游戏准备中'; alert('对手已加入'); }
            handleGameContinue(data) { alert('游戏继续'); if (data.role) { this.playerRole = data.role; this.domCache.get('playerRole').textContent = this.playerRole === 'first_player' ? '先手' : '后手'; } }

            handleSyncRequest(data) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify({ type: 'sync_response', history: this.game.state.history, isMyTurn: !this.isMyTurn })); }
                this.domCache.get('gameStatus').textContent = this.isMyTurn ? '轮到你' : '等待对手';
            }

            handleGameStart(data) {
                this.playerRole = data.role;
                this.domCache.get('playerRole').textContent = data.role === 'first_player' ? '先手' : '后手';
                this.domCache.get('gameStatus').textContent = '游戏开始';
                this.isNetworkGame = true;
                if (data.role === 'first_player') { this.isMyTurn = true; alert('你是先手，请开始游戏'); } else { this.isMyTurn = false; alert('你是后手，等待先手操作'); }
            }

            handleGameAction(data) {
                const action = data.action; console.log('收到游戏操作:', action);
                switch (action.opt) {
                    case 'mainX': case 'mainO': case 'subX': case 'subO': this.game.board.processBuild(action.x, action.y, true); this.isMyTurn = false; this.game.status.updateDisplay(true); break;
                    case 'layX': this.game.board.processLay(action.x, action.y, true); this.isMyTurn = false; this.game.status.updateDisplay(true); break;
                    case 'layO': this.game.board.processLay(action.x, action.y, true); this.isMyTurn = true; this.game.status.updateDisplay(true); break;
                    case 'choose': this.game.board.processChoose(action.x, action.y, true); this.isMyTurn = false; this.game.status.updateDisplay(true); break;
                    case 'x-place': case 'o-place': this.game.board.processPlace(action.x, action.y, true); this.isMyTurn = true; this.game.status.updateDisplay(true); break;
                    case 'x-eat': case 'o-eat': this.game.board.processEat(action.x, action.y, true); this.isMyTurn = true; this.game.status.updateDisplay(true); break;
                    case 'random':
                        this.game.state.mainCities = action.mainCities; this.game.state.subCities = action.subCities;
                        if (action.resources) { action.resources.forEach(resource => { if (resource.x >= 0 && resource.x < gameConfig.size && resource.y >= 0 && resource.y < gameConfig.size) this.game.state.state[resource.y][resource.x].type = 'resource'; }); }
                        if (action.isRandomCitiesEnabled) this.game.state.buildPhase = 'x-lay'; else this.game.state.buildPhase = 'x-main';
                        this.game.domCache.get('randomMapBtn').disabled = true; document.getElementById('randomCitiesToggle').disabled = true; document.getElementById('resourceToggle').disabled = true;
                        this.game.board.drawBoardBg(); this.game.board.drawBoard(); this.game.status.updateDisplay(true);
                        this.game.status.saveHistory({ opt: 'random', mainCities: JSON.parse(JSON.stringify(this.game.state.mainCities)), subCities: JSON.parse(JSON.stringify(this.game.state.subCities)), resources: action.resources, isRandomCitiesEnabled: action.isRandomCitiesEnabled, isResourceEnabled: action.isResourceEnabled });
                        break;
                    case 'select': this.game.board.processSelect(action.x, action.y); this.isMyTurn = false; break;
                    case 'undo':
                        if (confirm('对手请求悔棋，是否同意？')) { this.sendGameAction({ opt: 'undo-reply', reply: true, historyLength: action.historyLength }); this.game.performUndo(action.historyLength - 1); this.isMyTurn = false; }
                        else { this.sendGameAction({ opt: 'undo-reply', reply: false }); }
                        break;
                    case 'undo-reply':
                        if (action.reply) { this.game.performUndo(action.historyLength - 1); this.isMyTurn = true; this.game.status.updateDisplay(true); } else { alert('对手拒绝悔棋'); }
                        break;
                    case 'restart':
                        if (confirm('对手请求重新开局，是否同意？')) { this.sendGameAction({ opt: 'restart-reply', reply: true }); this.game.performReset(); this.isMyTurn = this.playerRole === 'first_player'; this.game.status.updateDisplay(true); }
                        else { this.sendGameAction({ opt: 'restart-reply', reply: false }); }
                        break;
                    case 'restart-reply': if (action.reply) { this.game.performReset(); this.isMyTurn = this.playerRole === 'first_player'; this.game.status.updateDisplay(true); } else { alert('对手拒绝重新开局'); } break;
                    case 'calculate':
                        if (confirm('对手请求结算胜负，是否同意？')) { this.sendGameAction({ opt: 'calculate-reply', reply: true }); this.game.board.calculateEndgame(); }
                        else { this.sendGameAction({ opt: 'calculate-reply', reply: false }); }
                        break;
                    case 'calculate-reply': if (action.reply) { this.game.board.calculateEndgame(); } else { alert('对手拒绝结算胜负'); } break;
                    case 'export':
                        if (confirm('对手请求导出棋局，是否同意？')) { this.sendGameAction({ opt: 'export-reply', reply: true }); this.game.ui.performExport(); }
                        else { this.sendGameAction({ opt: 'export-reply', reply: false }); }
                        break;
                    case 'export-reply': if (action.reply) { this.game.ui.performExport(); } else { alert('对手拒绝导出棋局'); } break;
                }
                if (action && action.fromX !== undefined && action.fromY !== undefined) this.game.status.flashCell(action.fromX, action.fromY, 'rgba(128, 200, 255, 0.8)', 3000);
                if (action && action.x !== undefined && action.y !== undefined) {
                    if (action.opt === 'x-place' || action.opt === 'o-place') this.game.status.flashCell(action.x, action.y, 'rgba(100, 200, 100, 0.5)', 3000);
                    else if (action.opt === 'x-eat' || action.opt === 'o-eat') this.game.status.flashCell(action.x, action.y, 'rgba(255, 204, 199, 0.8)', 3000);
                    else if (action.opt !== 'select') this.game.status.flashCell(action.x, action.y, 'rgba(100, 200, 100, 0.5)', 3000);
                }
                this.domCache.get('gameStatus').textContent = this.isMyTurn ? '轮到你' : '等待对手';
            }

            handleSyncState(data) {
                if (data.history) { this.game.state.history = data.history; this.game.board.replayHistory(this.game.state.history.length - 1); }
                if (data.isMyTurn !== undefined) this.isMyTurn = data.isMyTurn;
                this.isNetworkGame = true;
                this.game.status.renderFullHistory();
                this.game.board.initBoard(); this.game.board.drawBoardBg(); this.game.board.drawBoard();
                this.game.status.updateDisplay();
            }

            handlePlayerLeft(data) { alert('对手离开了游戏'); this.domCache.get('gameStatus').textContent = '对手离开'; }
            handleError(data) { alert('错误: ' + data.message); }
        }

        // UI类
        class UI {
            constructor(game) { this.game = game; this.domCache = game.domCache; }

            initDragScroll() {
                let isDragging = false, startX, startY, scrollLeft, scrollTop, dragStartX, dragStartY;
                const DRAG_THRESHOLD = 2;
                const handleMouseDown = (e) => {
                    isDragging = true; this.game.isClick = true; dragStartX = e.clientX; dragStartY = e.clientY;
                    startX = e.pageX - this.domCache.get('scrollArea').getBoundingClientRect().left;
                    startY = e.pageY - this.domCache.get('scrollArea').getBoundingClientRect().top;
                    scrollLeft = this.domCache.get('scrollArea').scrollLeft; scrollTop = this.domCache.get('scrollArea').scrollTop;
                    this.domCache.get('scrollArea').style.cursor = 'grabbing'; document.body.style.userSelect = 'none';
                };
                const handleMouseMove = (e) => {
                    if (!isDragging) return;
                    const distance = Math.sqrt(Math.pow(e.clientX - dragStartX, 2) + Math.pow(e.clientY - dragStartY, 2));
                    if (distance > DRAG_THRESHOLD) this.game.isClick = false;
                    const x = e.pageX - this.domCache.get('scrollArea').getBoundingClientRect().left, y = e.pageY - this.domCache.get('scrollArea').getBoundingClientRect().top;
                    const dragRatio = 1 / gameConfig.zoom;
                    this.domCache.get('scrollArea').scrollLeft = scrollLeft - (x - startX) * dragRatio;
                    this.domCache.get('scrollArea').scrollTop = scrollTop - (y - startY) * dragRatio;
                };
                const handleMouseUp = () => { if (isDragging) { isDragging = false; this.domCache.get('scrollArea').style.cursor = 'default'; document.body.style.userSelect = ''; } };
                this.domCache.get('scrollArea').addEventListener('mousedown', handleMouseDown);
                document.addEventListener('mousemove', handleMouseMove); document.addEventListener('mouseup', handleMouseUp); document.addEventListener('mouseleave', handleMouseUp);
            }

            updateHoverHighlight() {
                if (this.game.hoverState.x === this.game.hoverState.lastX && this.game.hoverState.y === this.game.hoverState.lastY) return;
                if (this.game.hoverState.lastX !== -1 && this.game.hoverState.lastY !== -1) this.game.board.updateCell(this.game.hoverState.lastX, this.game.hoverState.lastY);
                if (this.game.hoverState.x !== -1 && this.game.hoverState.y !== -1) {
                    const baseCellSize = gameConfig.cell, gapSize = 1;
                    const cellX = this.game.hoverState.x * (baseCellSize + gapSize), cellY = this.game.hoverState.y * (baseCellSize + gapSize);
                    this.domCache.get('ctx').clearRect(cellX, cellY, baseCellSize, baseCellSize);
                    this.game.board.updateCell(this.game.hoverState.x, this.game.hoverState.y);
                    this.domCache.get('ctx').fillStyle = 'rgba(200, 200, 200, 0.3)';
                    this.domCache.get('ctx').fillRect(cellX, cellY, baseCellSize, baseCellSize);
                }
            }

            initZoom() { this.setZoom(1); this.setupZoomSlider(); this.updateZoomSlider(); this.setupTouchZoom(); }

            setupTouchZoom() {
                let initialDistance = 0, initialZoom = 1, isPinching = false;
                const getDistance = (touch1, touch2) => Math.sqrt(Math.pow(touch2.clientX - touch1.clientX, 2) + Math.pow(touch2.clientY - touch1.clientY, 2));
                const handleTouchStart = (e) => { if (e.touches.length === 2) { isPinching = true; initialDistance = getDistance(e.touches[0], e.touches[1]); initialZoom = gameConfig.zoom; } };
                const handleTouchMove = (e) => { if (isPinching && e.touches.length === 2) { e.preventDefault(); const currentDistance = getDistance(e.touches[0], e.touches[1]); const scale = currentDistance / initialDistance; let newZoom = Math.max(gameConfig.minZoom, Math.min(gameConfig.maxZoom, initialZoom * scale)); this.setZoom(newZoom); this.updateZoomSlider(); } };
                const handleTouchEnd = () => { isPinching = false; };
                this.domCache.get('board').addEventListener('touchstart', handleTouchStart);
                this.domCache.get('board').addEventListener('touchmove', handleTouchMove, { passive: false });
                this.domCache.get('board').addEventListener('touchend', handleTouchEnd); this.domCache.get('board').addEventListener('touchcancel', handleTouchEnd);
            }

            updateZoomSlider() { const percent = ((gameConfig.zoom - gameConfig.minZoom) / (gameConfig.maxZoom - gameConfig.minZoom)) * 100; this.domCache.get('zoomFill').style.width = `${percent}%`; this.domCache.get('zoomThumb').style.left = `${percent}%`; this.domCache.get('zoomValue').textContent = `${Math.round(gameConfig.zoom * 100)}%`; }

            setupZoomSlider() {
                let isDragging = false;
                const getZoomFromPos = (clientX) => { const rect = this.domCache.get('zoomSlider').getBoundingClientRect(); let percent = (clientX - rect.left) / rect.width; percent = Math.max(0, Math.min(1, percent)); return gameConfig.minZoom + (gameConfig.maxZoom - gameConfig.minZoom) * percent; };
                const handleThumbDown = (e) => { isDragging = true; this.domCache.get('zoomThumb').style.cursor = 'grabbing'; document.body.style.userSelect = 'none'; e.preventDefault(); };
                const handleSliderClick = (e) => { if (e.target !== this.domCache.get('zoomThumb')) this.setZoom(getZoomFromPos(e.clientX)); };
                const handleMouseMove = (e) => { if (isDragging) this.setZoom(getZoomFromPos(e.clientX)); };
                const handleMouseUp = () => { if (isDragging) { isDragging = false; this.domCache.get('zoomThumb').style.cursor = 'grab'; document.body.style.userSelect = ''; } };
                this.domCache.get('zoomThumb').addEventListener('mousedown', handleThumbDown);
                this.domCache.get('zoomSlider').addEventListener('mousedown', handleSliderClick);
                document.addEventListener('mousemove', handleMouseMove); document.addEventListener('mouseup', handleMouseUp); document.addEventListener('touchend', handleMouseUp);
                this.domCache.get('zoomThumb').addEventListener('touchstart', (e) => { isDragging = true; e.preventDefault(); });
                document.addEventListener('touchmove', (e) => { if (!isDragging) return; e.preventDefault(); this.setZoom(getZoomFromPos(e.touches[0].clientX)); });
            }

            setZoom(level) {
                level = parseFloat(level.toFixed(2));
                if (level < gameConfig.minZoom) level = gameConfig.minZoom; else if (level > gameConfig.maxZoom) level = gameConfig.maxZoom;
                if (Math.abs(level - gameConfig.zoom) < 0.01) return;
                const oldZoom = gameConfig.zoom, oldScrollLeft = this.domCache.get('scrollArea').scrollLeft, oldScrollTop = this.domCache.get('scrollArea').scrollTop;
                gameConfig.zoom = level;
                this.domCache.get('boardBg').style.transform = `scale(${gameConfig.zoom})`; this.domCache.get('board').style.transform = `scale(${gameConfig.zoom})`;
                const baseBoardSize = gameConfig.size * (gameConfig.cell + 1);
                this.domCache.get('virtualBoardContainer').style.width = `${baseBoardSize * gameConfig.zoom}px`; this.domCache.get('virtualBoardContainer').style.height = `${baseBoardSize * gameConfig.zoom}px`;
                this.updateZoomSlider();
                requestAnimationFrame(() => { const scaleRatio = gameConfig.zoom / oldZoom; this.domCache.get('scrollArea').scrollLeft = oldScrollLeft * scaleRatio; this.domCache.get('scrollArea').scrollTop = oldScrollTop * scaleRatio; });
            }

            zoomIn() { this.setZoom(gameConfig.zoom + 0.1); }
            zoomOut() { this.setZoom(gameConfig.zoom - 0.1); }

            performExport() {
                const exportData = { meta: { version: "6", timestamp: new Date().toISOString(), buttons: { randomCitiesToggle: this.domCache.get('randomCitiesToggle').checked, resourceToggle: this.domCache.get('resourceToggle').checked } }, history: this.game.state.history };
                const jsonStr = JSON.stringify(exportData); const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
                const defaultBase = `圈叉棋_棋局${new Date().getTime()}`; let inputBase = prompt('请输入导出文件名：', defaultBase);
                if (inputBase === null) return; inputBase = inputBase.trim(); if (inputBase === '') inputBase = defaultBase;
                inputBase = inputBase.replace(/[\\\/:*?"<>|]/g, '_');
                const fileName = inputBase.toLowerCase().endsWith('.json') ? inputBase : `${inputBase}.json`;
                const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName; a.click(); URL.revokeObjectURL(a.href);
                alert(`棋局已导出：${fileName}`);
            }

            importData() {
                const fileInput = document.createElement("input"); fileInput.type = "file"; fileInput.accept = ".json";
                fileInput.onchange = (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const importData = JSON.parse(event.target.result);
                            if (!this.validateImportData(importData)) { alert("导入失败：文件格式错误或数据不完整！"); return; }
                            this.restoreGameState(importData);
                            this.game.board.initBoard(); this.game.board.drawBoardBg(); this.game.board.drawBoard();
                            this.game.ui.updateZoomSlider(); this.game.status.updateDisplay(); alert("棋局导入成功！");
                        } catch (error) { console.error("导入解析失败：", error); alert(`导入失败：${error.message}`); }
                    };
                    reader.readAsText(file);
                };
                fileInput.click();
            }

            validateImportData(data) { if (!data || !data.history) return false; return true; }

            restoreGameState(data) {
                this.game.state.history = data.history || [];
                this.game.board.replayHistory(this.game.state.history.length - 1);
                this.game.status.clearFlashQueue();
                this.game.status.renderFullHistory();
                gameConfig.zoom = 1;
                if (data.meta && data.meta.buttons) {
                    if (data.meta.buttons.randomCitiesToggle !== undefined) this.domCache.get('randomCitiesToggle').checked = data.meta.buttons.randomCitiesToggle;
                    if (data.meta.buttons.resourceToggle !== undefined) this.domCache.get('resourceToggle').checked = data.meta.buttons.resourceToggle;
                }
            }
        }

        // 创建全局游戏实例
        let game;
        window.onload = function() { game = new Game(); game.domCache.get('connectionStatus').textContent = '未连接'; game.domCache.get('connectionStatus').style.color = '#d63031'; };
    </script>
</body>
</html>
