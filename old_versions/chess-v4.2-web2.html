        // 清理并停止高亮队列与调度器
        function clearFlashQueue() {
            // 清除数组
            flashQueue = [];
            // 清除定时器
            if (flashSchedulerTimer) {
                clearTimeout(flashSchedulerTimer);
                flashSchedulerTimer = null;
            }
            lastScheduledExpiry = 0;
            // 重绘以清空高亮
            requestAnimationFrame(drawBoard);
        }

        // 严格 FIFO 高亮调度器实现
        // flashQueue 元素形如 {id, x, y, color, expiry}
        let flashSchedulerTimer = null;
        let lastScheduledExpiry = 0;

        function flashCell(x, y, color = 'rgba(0,200,0,0.45)', duration = 2000) {
            if (x < 0 || y < 0 || x >= gameConfig.size || y >= gameConfig.size) return;
            const now = Date.now();
            const desiredExpiry = now + duration;
            // 保证严格递增的到期时间（FIFO）
            const expiry = Math.max(desiredExpiry, lastScheduledExpiry + 1);
            lastScheduledExpiry = expiry;

            const entry = { id: `${now}_${Math.random()}`, x, y, color, expiry };
            flashQueue.push(entry);

            // 触发重绘（使用 rAF 更稳健）
            requestAnimationFrame(drawBoard);

            // 确保有定时器在运行处理出队
            if (!flashSchedulerTimer && flashQueue.length > 0) {
                const processQueue = () => {
                    flashSchedulerTimer = null;
                    const now = Date.now();
                    let removed = false;
                    while (flashQueue.length && flashQueue[0].expiry <= now) {
                        flashQueue.shift();
                        removed = true;
                    }
                    if (removed) {
                        requestAnimationFrame(drawBoard);
                    }
                    if (flashQueue.length > 0) {
                        const nextExpiry = flashQueue[0].expiry;
                        const delay = Math.max(0, nextExpiry - now);
                        flashSchedulerTimer = setTimeout(processQueue, delay + 1);
                    } else {
                        lastScheduledExpiry = 0;
                    }
                };
                
                const nextExpiry = flashQueue[0].expiry;
                const delay = Math.max(0, nextExpiry - now);
                flashSchedulerTimer = setTimeout(processQueue, delay + 1);
            }
        }

        // 绘制当前队列中的高亮（在 drawBoard 末尾调用）
        function drawFlashesOverlay() {
            if (!flashQueue || flashQueue.length === 0) return;
            const ctx = el.ctx;
            const baseCellSize = gameConfig.cell;
            const gapSize = 1;
            const now = Date.now();
            // 按队列顺序绘制，先入先绘
            for (const e of flashQueue) {
                if (e.expiry <= now) continue; // 已到期（处理器可能尚未清理）
                if (e.x < 0 || e.y < 0 || e.x >= gameConfig.size || e.y >= gameConfig.size) continue;
                const cellX = e.x * (baseCellSize + gapSize);
                const cellY = e.y * (baseCellSize + gapSize);
                ctx.save();
                ctx.fillStyle = e.color || 'rgba(0,200,0,0.45)';
                ctx.fillRect(cellX, cellY, baseCellSize, baseCellSize);
                ctx.restore();
            }
        }

        // 重放历史记录
        function replayHistory(stepCount) {
            // 重置初始状态
            cfg.state = Array.from({ length: gameConfig.size }, () => 
                Array.from({ length: gameConfig.size }, () => ({ type: 'empty' }))
            );
            cfg.mainCities = [];
            cfg.subCities = [];
            cfg.selected = null;
            cfg.buildPhase = 'x-main';
            el.randomMapBtn.disabled = false;
            el.randomCitiesToggle.disabled = false;
            el.resourceToggle.disabled = false;

            // 重放操作 - 从初始状态重新执行每个动作
            for (let i = 0; i <= stepCount; i++) {
                const action = cfg.history[i];
                if (!action) break;

                // 执行动作 - 根据opt字段判断操作类型
                const opt = action.opt;
                if (!opt) continue;
            
                switch (opt) {
                    case 'mainX':
                    case 'mainO':
                    case 'subX':
                    case 'subO':
                        // 建城操作
                        handleBuild(action.x, action.y, false);
                        break;
                    case 'layX':
                    case 'layO':
                        // 置子操作
                        handleLay(action.x, action.y, false);
                        break;
                    case 'choose':
                        // 选择先手
                        cfg.buildPhase = action.player === 'cross' ? 'x-game' : 'o-game';
                        break;
                    case 'x-place':
                    case 'o-place':
                        // 放置棋子操作
                        handlePlace(action.x, action.y, false);
                        break;
                    case 'x-eat':
                    case 'o-eat':
                        // 吃子操作
                        handleEat(action.x, action.y, false);
                        break;
                    case 'random':
                        // 随机地图操作
                        cfg.mainCities = action.mainCities ? JSON.parse(JSON.stringify(action.mainCities)) : [];
                        cfg.subCities = action.subCities ? JSON.parse(JSON.stringify(action.subCities)) : [];
                        
                        // 恢复资源点
                        if (action.resources && action.resources.length > 0) {
                            action.resources.forEach(resource => {
                                if (resource.x >= 0 && resource.x < gameConfig.size && resource.y >= 0 && resource.y < gameConfig.size) {
                                    cfg.state[resource.y][resource.x].type = 'resource';
                                }
                            });
                        }
                        
                        // 根据isRandomCitiesEnabled决定后续阶段
                        if (action.isRandomCitiesEnabled) {
                            cfg.buildPhase = 'x-lay';
                        } else {
                            cfg.buildPhase = 'x-main';
                        }
                        el.randomMapBtn.disabled = true;
                        el.randomCitiesToggle.disabled = true;
                        el.resourceToggle.disabled = true;
                        break;
                    case 'init':
                        // 初始化操作，不做任何处理
                        break;
                }
            }
        }

        // 执行悔棋操作
        function performUndo(targetLength) {
            // console.log('=== 悔棋前历史记录 ===');
            // console.log('历史记录长度:', cfg.history.length);
            // console.log('历史记录内容:', JSON.stringify(cfg.history, null, 2));
            
            // 确保有足够的历史记录可以悔棋
            if (cfg.history.length <= 1) {
                alert('无法悔棋');
                return;
            }
            
            let targetStep;
            if (targetLength !== undefined) {
                // 根据指定长度回撤
                if (targetLength < 1) {
                    alert('无法悔棋');
                    return;
                }
                cfg.history.splice(targetLength);
                targetStep = targetLength - 1;
            } else {
                // 默认只回退一步
                cfg.history.pop();
                targetStep = cfg.history.length - 1;
            }
            
            replayHistory(targetStep);
            
            // console.log('=== 悔棋后历史记录 ===');
            // console.log('历史记录长度:', cfg.history.length);
            // console.log('历史记录内容:', JSON.stringify(cfg.history, null, 2));
            
            drawBoard();

        // 悔棋
        function undoMove() {
            if (isNetworkGame) {
                if (playerRole !== 'first_player' && !cfg.buildPhase.endsWith('game')) {
                    alert('后手此时不能悔棋');
                    return;
                }
                if (playerRole === 'first_player' && (cfg.history[cfg.history.length - 1].opt === 'choose' || cfg.history[cfg.history.length - 2].opt === 'choose')) {

                             cfg.history.length - 1 : cfg.history.length;
                } else {
                    length = cfg.buildPhase.endsWith('game')
                             && cfg.history[cfg.history.length - 1].opt !== 'choose'
                             && isMyTurn ? 
                             cfg.history.length - 1 : cfg.history.length;
                }
                
                sendGameAction({
                    opt: 'undo',
                    historyLength: length
                });
                alert('等待对方同意悔棋...');
            } else {
                performUndo();

        // 执行结算胜负操作
        function performCalculateEndgame() {
            let circleKill = 0, crossKill = 0, circleResources = 0, crossResources = 0;
            let circleSubCityScore = 0, crossSubCityScore = 0;
            
            // 统计资源点和混合点的占领情况
            for (let y = 0; y < gameConfig.size; y++) {
                for (let x = 0; x < gameConfig.size; x++) {
                    if (cfg.state[y][x].type !== 'mix' && cfg.state[y][x].type !== 'resource') continue;
                    
                    let circle = 0, cross = 0;
                    for (const [dx, dy] of OFFSETS_3x3) {
                        const nx = x + dx, ny = y + dy;
                        if (nx < 0 || nx >= gameConfig.size || ny < 0 || ny >= gameConfig.size) continue;
                        const type = cfg.state[ny][nx].type;
                        if (type === 'circle') circle++;
                        else if (type === 'cross') cross++;
                    }
                    
                    if (circle > cross) cfg.state[y][x].type === 'mix' ? circleKill++ : circleResources++;
                    else if (cross > circle) cfg.state[y][x].type === 'mix' ? crossKill++ : crossResources++;
                }
            }
            
            // 统计副城中的己方活棋数
            const subAreaOffset = Math.floor(SUB_CITY_AREA / 2);
            cfg.subCities.forEach(subCity => {
                // 只统计未被攻占的副城
                if (!subCity.lost) {
                    const owner = subCity.owner;
                    let friendlyCount = 0;
                    
                    // 遍历副城范围内的所有格子
                    for (let dy = -subAreaOffset; dy <= subAreaOffset; dy++) {
                        for (let dx = -subAreaOffset; dx <= subAreaOffset; dx++) {
                            const nx = subCity.x + dx;
                            const ny = subCity.y + dy;
                            if (nx < 0 || nx >= gameConfig.size || ny < 0 || ny >= gameConfig.size) continue;
                            
                            const type = cfg.state[ny][nx].type;
                            if ((owner === 'circle' && type === 'circle') || 
                                (owner === 'cross' && type === 'cross')) {
                                friendlyCount++;
                            }
                        }
                    }
                    
                    if (owner === 'circle') {
                        circleSubCityScore += friendlyCount;
                    } else {
                        crossSubCityScore += friendlyCount;
                    }
                }
            });
            
            stats = { ...stats, circleKill, crossKill, circleResources, crossResources, circleSubCityScore, crossSubCityScore };
            
            // 显示统计数据
            el.circleKill.textContent = `◯ ${circleKill}`;
            el.crossKill.textContent = `✕ ${crossKill}`;
            el.circleResources.textContent = `◯ ${circleResources}`;
            el.crossResources.textContent = `✕ ${crossResources}`;
            el.circleSubcity.textContent = `◯ ${circleSubCityScore}`;
            el.crossSubcity.textContent = `✕ ${crossSubCityScore}`;
            
            // 计算最终得分
            const circleTotal = circleKill + circleResources + circleSubCityScore;
            const crossTotal = crossKill + crossResources + crossSubCityScore;
            
            // 检查主城是否被攻占
            const circleMainCityLost = cfg.mainCities.some(city => city.owner === 'circle' && city.lost);
            const crossMainCityLost = cfg.mainCities.some(city => city.owner === 'cross' && city.lost);

            // 判断胜利
            let winner = '';
            if (!circleMainCityLost && crossMainCityLost) {
                winner = `◯ 方胜利`;
            } else if (circleMainCityLost && !crossMainCityLost) {
                winner = `✕ 方胜利`;
            } else if (circleTotal > crossTotal) {
                winner = `◯ 方胜利(${circleTotal}:${crossTotal})`;
            } else if (crossTotal > circleTotal) {
                winner = `✕ 方胜利(${crossTotal}:${circleTotal})`;
            } else {
                winner = `平局(${circleTotal}:${crossTotal})`;
            }
            
            el.winnerText.textContent = winner;
        }

        // 结算胜负
        function calculateEndgame() {
            if (isNetworkGame) {
                // calculate不论是否轮到都可以申请
                sendGameAction({
                    opt: 'calculate'
                });
                alert('等待对方同意结算胜负...');
            } else {
                performCalculateEndgame();
                updateDisplay(true);
            }
        }


        // ========== 缩放控制 ==========
        function initZoom() {
            setZoom(1);
            setupZoomSlider();
            updateZoomSlider();
            setupTouchZoom();
        }
        
        function setupTouchZoom() {
            let initialDistance = 0;
            let initialZoom = 1;
            let isPinching = false;
            
            const getDistance = (touch1, touch2) => {
                const dx = touch2.clientX - touch1.clientX;
                const dy = touch2.clientY - touch1.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            };
            
            const handleTouchStart = (e) => {
                if (e.touches.length === 2) {
                    isPinching = true;
                    initialDistance = getDistance(e.touches[0], e.touches[1]);
                    initialZoom = gameConfig.zoom;
                }
            };
            
            const handleTouchMove = (e) => {
                if (isPinching && e.touches.length === 2) {
                    // 阻止浏览器默认的放大动作
                    e.preventDefault();
                    const currentDistance = getDistance(e.touches[0], e.touches[1]);
                    const scale = currentDistance / initialDistance;
                    let newZoom = initialZoom * scale;
                    
                    // 限制缩放范围
                    newZoom = Math.max(gameConfig.minZoom, Math.min(gameConfig.maxZoom, newZoom));
                    setZoom(newZoom);
                    updateZoomSlider();
                }
            };
            
            const handleTouchEnd = () => {
                isPinching = false;
            };
            
            // 绑定触屏事件
            el.board.addEventListener('touchstart', handleTouchStart);
            el.board.addEventListener('touchmove', handleTouchMove, { passive: false });
            el.board.addEventListener('touchend', handleTouchEnd);
            el.board.addEventListener('touchcancel', handleTouchEnd);
        }

        function updateZoomSlider() {
            const percent = ((gameConfig.zoom - gameConfig.minZoom) / (gameConfig.maxZoom - gameConfig.minZoom)) * 100;
            el.zoomFill.style.width = `${percent}%`;
            el.zoomThumb.style.left = `${percent}%`;
            el.zoomValue.textContent = `${Math.round(gameConfig.zoom * 100)}%`;
        }

        function setupZoomSlider() {
            let isDragging = false;
            
            const getZoomFromPos = (clientX) => {
                const rect = el.zoomSlider.getBoundingClientRect();
                let percent = (clientX - rect.left) / rect.width;
                percent = Math.max(0, Math.min(1, percent));
                return gameConfig.minZoom + (gameConfig.maxZoom - gameConfig.minZoom) * percent;
            };
            
            const handleThumbDown = (e) => {
                isDragging = true;
                el.zoomThumb.style.cursor = 'grabbing';
                document.body.style.userSelect = 'none';
                e.preventDefault();
            };
            
            const handleSliderClick = (e) => {
                if (e.target === el.zoomThumb) return;
                const newZoom = getZoomFromPos(e.clientX);
                setZoom(newZoom);
            };
            
            const handleMouseMove = (e) => {
                if (!isDragging) return;
                const newZoom = getZoomFromPos(e.clientX);
                setZoom(newZoom);
            };
            
            const handleMouseUp = () => {
                if (isDragging) {
                    isDragging = false;
                    el.zoomThumb.style.cursor = 'grab';
                    document.body.style.userSelect = '';
                }
            };

            // 绑定事件
            el.zoomThumb.addEventListener('mousedown', handleThumbDown);
            el.zoomSlider.addEventListener('mousedown', handleSliderClick);
            document.addEventListener('mousemove', handleMouseMove);
            document.addEventListener('mouseup', handleMouseUp);
            document.addEventListener('touchend', handleMouseUp);
            
            // 移动端适配
            el.zoomThumb.addEventListener('touchstart', (e) => {
                isDragging = true;
                e.preventDefault();
            });
            
            document.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                e.preventDefault();
                const touch = e.touches[0];
                const newZoom = getZoomFromPos(touch.clientX);
                setZoom(newZoom);
            });
        }

        function setZoom(level) {
            level = parseFloat(level.toFixed(2));
            
            if (level < gameConfig.minZoom) level = gameConfig.minZoom;
            else if (level > gameConfig.maxZoom) level = gameConfig.maxZoom;
            
            if (Math.abs(level - gameConfig.zoom) < 0.01) return;
            
            const oldZoom = gameConfig.zoom;
            const oldScrollLeft = el.scrollArea.scrollLeft;
            const oldScrollTop = el.scrollArea.scrollTop;
            
            gameConfig.zoom = level;
            
            // 保留GPU加速的scale缩放（同时缩放背景层和前景层）
            el.boardBg.style.transform = `scale(${gameConfig.zoom})`;
            el.board.style.transform = `scale(${gameConfig.zoom})`;
            
            // 同步虚拟容器尺寸（解决滚动范围问题）
            const baseBoardSize = gameConfig.size * (gameConfig.cell + 1);
            el.virtualBoardContainer.style.width = `${baseBoardSize * gameConfig.zoom}px`;
            el.virtualBoardContainer.style.height = `${baseBoardSize * gameConfig.zoom}px`;
            
            updateZoomSlider();
            
            // 精准调整滚动位置
            requestAnimationFrame(() => {
                const scaleRatio = gameConfig.zoom / oldZoom;
                el.scrollArea.scrollLeft = oldScrollLeft * scaleRatio;
                el.scrollArea.scrollTop = oldScrollTop * scaleRatio;
            });
        }

        function zoomIn() {
            setZoom(gameConfig.zoom + 0.1);
        }

        function zoomOut() {
            setZoom(gameConfig.zoom - 0.1);
        }

        // 执行导出操作
        function performExport() {
            const exportData = {

            const a = document.createElement("a");

        function import_data() {
            const fileInput = document.createElement("input");
            fileInput.type = "file";
            fileInput.accept = ".json";

            fileInput.onchange = function (e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function (event) {
                    try {
                        const importData = JSON.parse(event.target.result);
                        if (!validateImportData(importData)) {
                            alert("导入失败：文件格式错误或数据不完整！");
                            return;
                        }

                        restoreGameState(importData);

                        
                        initBoard();
                        drawBoardBg();
                        drawBoard();

                        updateZoomSlider();
                        
                        updateDisplay();
                        alert("棋局导入成功！");
                    } catch (error) {
                        console.error("导入解析失败：", error);
                        alert(`导入失败：${error.message}`);
                    }
                };
                reader.readAsText(file);
            };

            fileInput.click();
        }

        //============== 初始化游戏 ===============
        function initGame() {
            // 初始化核心状态cfg
            cfg.state = Array.from({ length: gameConfig.size }, () => 
                Array.from({ length: gameConfig.size }, () => ({ type: 'empty' }))
            );
            cfg.history = [];
            cfg.selected = null;
            cfg.buildPhase = 'x-main';
            cfg.mainCities = [];
            cfg.subCities = [];
            cfg.randomBtnDisabled = false;
            stats = {
                circle: 0, cross: 0, mix: 0, 
                circleKill: 0, crossKill: 0, 
                circleResources: 0, crossResources: 0, 
                circleSubCityScore: 0, crossSubCityScore: 0
            };

            // 重置UI
            el.randomMapBtn.disabled = false;
            el.randomCitiesToggle.disabled = false;
            el.resourceToggle.disabled = false;
            el.scrollArea.scrollLeft = el.scrollArea.scrollTop = 0;
            el.winnerText.textContent = '- 未结算 -';

            // 清理高亮队列并清空并渲染空的棋局记录面板
            clearFlashQueue();
            renderFullHistory();

            // 初始化核心功能
            saveHistory({opt: 'init'}); 
            
            initZoom();
            initBoard();
            initDragScroll();

            // 滚动事件节流
            const throttledScroll = (() => {
                let timer = null;
                return () => {
                    if (!timer) {
                        timer = setTimeout(() => {
                            timer = null;
                        }, 15);
                    }
                };
            })();
            el.scrollArea.addEventListener('scroll', throttledScroll);

            // 窗口resize适配
            const handleResize = (() => {
                let timer = null;
                return () => {
                    if (!timer) {
                        timer = setTimeout(() => {
                            initBoard();
                            drawBoardBg();
                            drawBoard();
                            timer = null;
                        }, 50);
                    }
                };
            })();
            window.addEventListener('resize', handleResize);
        }

        // 启动游戏
        window.onload = initGame;

        
        // ========== WebSocket客户端功能 ==========
        
        // 连接WebSocket服务器
        function connectToServer() {
            if (ws) {
                alert('已经连接到服务器');
                return;
            }
            
            try {
                // 使用输入的服务器IP地址
                const serverIp = el.serverIpInput.value.trim() || 'localhost';
                const serverUrl = `ws://${serverIp}:8080`;
                ws = new WebSocket(serverUrl);
                
                ws.onopen = function() {
                    console.log('WebSocket连接已建立');
                    el.connectionStatus.textContent = '已连接';
                    el.connectionStatus.style.color = '#4CAF50';
                };
                
                ws.onmessage = function(event) {
                    try {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (error) {
                        console.error('消息解析错误:', error);
                    }
                };
                
                ws.onclose = function() {
                    console.log('WebSocket连接已关闭');
                    el.connectionStatus.textContent = '未连接';
                    el.connectionStatus.style.color = '#f44336';
                    ws = null;
                };
                
                ws.onerror = function(error) {
                    console.error('WebSocket错误:', error);
                    el.connectionStatus.textContent = '连接错误';
                    el.connectionStatus.style.color = '#f44336';
                };
            } catch (error) {
                console.error('WebSocket连接失败:', error);
                el.connectionStatus.textContent = '连接失败';
                el.connectionStatus.style.color = '#f44336';
            }
        }
        
        // 处理WebSocket消息
        function handleWebSocketMessage(data) {
            console.log('收到WebSocket消息:', data.type);
            console.log('消息内容:', data);
            switch (data.type) {
                case 'room_created':
                    handleRoomCreated(data);
                    break;
                case 'room_joined':
                    handleRoomJoined(data);
                    break;
                case 'player_joined':
                    handlePlayerJoined(data);
                    break;
                case 'game_start':
                    handleGameStart(data);
                    break;
                case 'game_continue':
                    handleGameContinue(data);
                    break;
                case 'game_action':
                    handleGameAction(data);
                    break;
                case 'sync_request':
                    handleSyncRequest(data);
                    break;
                case 'sync_state':
                    handleSyncState(data);
                    break;
                case 'player_left':
                    handlePlayerLeft(data);
                    break;
                case 'error':
                    handleError(data);
                    break;
                default:
                    console.log('未知消息类型:', data.type);
            }
        }
        
        // 处理房间创建
        function handleRoomCreated(data) {
            el.roomIdInput.value = data.roomId;
            el.gameStatus.textContent = '等待对手加入';
            alert(`房间创建成功！房间ID: ${data.roomId}`);
        }
        
        // 处理房间加入
        function handleRoomJoined(data) {
            el.gameStatus.textContent = '游戏准备中';
            alert('加入房间成功！游戏即将开始');
        }
        
        // 处理玩家加入
        function handlePlayerJoined(data) {
            el.gameStatus.textContent = '游戏准备中';
            alert('对手已加入');
        }
        
        // 处理游戏继续
        function handleGameContinue(data) {
            alert('游戏继续');
            if (data.role) {
                playerRole = data.role;
                el.playerRole.textContent = playerRole === 'first_player' ? '先手' : '后手';
            }
        }
        
        // 处理同步请求
        function handleSyncRequest(data) {
            // 发送游戏状态给新玩家，只发送history
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'sync_response',
                    history: cfg.history,
                    isMyTurn: !isMyTurn // 新玩家的回合是当前玩家回合的反
                }));
            }
            el.gameStatus.textContent = isMyTurn ? '轮到你' : '等待对手';
        }
        
        // 处理游戏开始
        function handleGameStart(data) {
            playerRole = data.role;
            el.playerRole.textContent = data.role === 'first_player' ? '先手' : '后手';
            el.gameStatus.textContent = '游戏开始';
            isNetworkGame = true;
            
            // 先手可以开始游戏，后手需要等待
            if (data.role === 'first_player') {
                isMyTurn = true;
                alert('你是先手，请开始游戏');
            } else {
                isMyTurn = false;
                alert('你是后手，等待先手操作');
            }
        }
        
        // 处理游戏操作
        function handleGameAction(data) {
            const action = data.action;
            console.log('收到游戏操作:', action);
            
            // 执行接收到的操作
            switch (action.opt) {
                case 'mainX':
                case 'mainO':
                case 'subX':
                case 'subO':
                    // 建城操作
                    handleBuild(action.x, action.y, true);
                    isMyTurn = false;
                    updateDisplay(true);
                    break;
                case 'layX':
                    // 置子操作
                    handleLay(action.x, action.y, true);
                    isMyTurn = false;
                    updateDisplay(true);
                    break;
                case 'layO':
                    // 置子操作
                    handleLay(action.x, action.y, true);
                    isMyTurn = true;
                    updateDisplay(true);
                    break;
                case 'choose':
                    // 选择先手
                    handleChoose(action.x, action.y, true);
                    isMyTurn = false;
                    updateDisplay(true);
                    break;
                case 'x-place':
                case 'o-place':
                    // 放置棋子
                    handlePlace(action.x, action.y, true);
                    isMyTurn = true;
                    updateDisplay(true);
                    break;
                case 'x-eat':
                case 'o-eat':
                    // 吃子操作
                    handleEat(action.x, action.y, true);
                    isMyTurn = true;
                    updateDisplay(true);
                    break;
                case 'random':
                    // 这里是类似重放历史记录的操作，用于导入对方的地图
                    cfg.mainCities = action.mainCities;
                    cfg.subCities = action.subCities;
                    
                    // 恢复资源点
                    if (action.resources) {
                        action.resources.forEach(resource => {
                            if (resource.x >= 0 && resource.x < gameConfig.size && resource.y >= 0 && resource.y < gameConfig.size) {
                                cfg.state[resource.y][resource.x].type = 'resource';
                            }
                        });
                    }
                    
                    // 根据isRandomCitiesEnabled决定后续阶段
                    if (action.isRandomCitiesEnabled) {
                        cfg.buildPhase = 'x-lay';
                    } else {
                        cfg.buildPhase = 'x-main';
                    }
                    
                    el.randomMapBtn.disabled = true;
                    document.getElementById('randomCitiesToggle').disabled = true;
                    document.getElementById('resourceToggle').disabled = true;
                    
                    drawBoardBg();
                    drawBoard();
                    updateDisplay(true);

                    saveHistory({
                        opt: 'random',
                        mainCities: JSON.parse(JSON.stringify(cfg.mainCities)),
                        subCities: JSON.parse(JSON.stringify(cfg.subCities)),
                        resources: action.resources,
                        isRandomCitiesEnabled: action.isRandomCitiesEnabled,
                        isResourceEnabled: action.isResourceEnabled
                    });
                    break;
                case 'select':
                    // 选中操作
                    handleSelect(action.x, action.y);
                    isMyTurn = false;
                    break;
                case 'undo':
                    // 收到undo请求，显示确认对话框
                    if (confirm('对手请求悔棋，是否同意？')) {
                        sendGameAction({
                            opt: 'undo-reply',
                            reply: true,
                            historyLength: action.historyLength
                        });
                        // 执行悔棋操作，回撤到指定长度
                        const targetLength = action.historyLength - 1;
                        performUndo(targetLength);
                        isMyTurn = false;
                    } else {
                        sendGameAction({
                            opt: 'undo-reply',
                            reply: false
                        });
                    }
                    break;
                case 'undo-reply':
                    // 收到undo回复
                    if (action.reply) {
                        // 对手同意悔棋，回撤到指定长度
                        const targetLength = action.historyLength - 1;
                        performUndo(targetLength);
                        isMyTurn = true;
                        updateDisplay(true);
                    } else {
                        alert('对手拒绝悔棋');
                    }
                    break;
                case 'restart':
                    // 收到restart请求，显示确认对话框
                    if (confirm('对手请求重新开局，是否同意？')) {
                        sendGameAction({
                            opt: 'restart-reply',
                            reply: true
                        });
                        // 执行重新开局
                        performReset();
                        isMyTurn = playerRole === 'first_player';
                        updateDisplay(true);
                    } else {
                        sendGameAction({
                            opt: 'restart-reply',
                            reply: false
                        });
                    }
                    break;
                case 'restart-reply':
                    // 收到restart回复
                    if (action.reply) {
                        // 对手同意重新开局
                        performReset();
                        isMyTurn = playerRole === 'first_player';
                        updateDisplay(true);
                    } else {
                        alert('对手拒绝重新开局');
                    }
                    break;
                case 'calculate':
                    // 收到calculate请求，显示确认对话框
                    if (confirm('对手请求结算胜负，是否同意？')) {
                        sendGameAction({
                            opt: 'calculate-reply',
                            reply: true
                        });
                        // 执行结算胜负
                        performCalculateEndgame();
                    } else {
                        sendGameAction({
                            opt: 'calculate-reply',
                            reply: false
                        });
                    }
                    break;
                case 'calculate-reply':
                    // 收到calculate回复
                    if (action.reply) {
                        // 对手同意结算胜负
                        performCalculateEndgame();
                    } else {
                        alert('对手拒绝结算胜负');
                    }
                    break;
                case 'export':
                    // 收到export请求，显示确认对话框
                    if (confirm('对手请求导出棋局，是否同意？')) {
                        sendGameAction({
                            opt: 'export-reply',
                            reply: true
                        });
                        // 执行导出
                        performExport();
                    } else {
                        sendGameAction({
                            opt: 'export-reply',
                            reply: false
                        });
                    }
                    break;
                case 'export-reply':
                    // 收到export回复
                    if (action.reply) {
                        // 对手同意导出棋局
                        performExport();
                    } else {
                        alert('对手拒绝导出棋局');
                    }
                    break;
            }
            
            // 高亮显示操作位置
            if (action && action.fromX !== undefined && action.fromY !== undefined) {
                // 起点使用选中高亮色
                flashCell(action.fromX, action.fromY, 'rgba(128, 200, 255, 0.8)', 3000);
            }
            if (action && action.x !== undefined && action.y !== undefined) {
                // 根据操作类型决定终点颜色
                if (action.opt === 'x-place' || action.opt === 'o-place') {
                    // 走子：终点标绿色
                    flashCell(action.x, action.y, 'rgba(100, 200, 100, 0.8)', 3000);
                } else if (action.opt === 'x-eat' || action.opt === 'o-eat') {
                    // 吃子：终点标红色（可吃标记色）
                    flashCell(action.x, action.y, 'rgba(255, 204, 199, 0.8)', 3000);
                } else if (action.opt !== 'select') {
                    // 其他操作：终点绿色
                    flashCell(action.x, action.y, 'rgba(100, 200, 100, 0.8)', 3000);
                }
            }

            // 更新游戏状态显示
            el.gameStatus.textContent = isMyTurn ? '轮到你' : '等待对手';
        }
        
        // 处理状态同步
        function handleSyncState(data) {
            // 只同步history，然后通过replayHistory恢复状态
            if (data.history) {
                cfg.history = data.history;
                replayHistory(cfg.history.length - 1);
            }
            
            if (data.isMyTurn !== undefined) {
                isMyTurn = data.isMyTurn; // 设置新玩家的回合状态
            }
            
            isNetworkGame = true; // 设置为网络对战模式

            initBoard();
            drawBoardBg();
            drawBoard();

            //updateZoomSlider();
            
            updateDisplay();
        }
        
        // 处理玩家离开
        function handlePlayerLeft(data) {
            alert('对手离开了游戏');
            el.gameStatus.textContent = '对手离开';
            //isNetworkGame = true;
        }
        
        // 处理错误
        function handleError(data) {
            alert('错误: ' + data.message);
        }
        
        // 断开服务器连接
        function disconnectServer() {
            if (ws) {
                ws.close();
                ws = null;
                el.connectionStatus.textContent = '未连接';
                el.connectionStatus.style.color = '#f44336';
                el.playerRole.textContent = '未分配';
                el.gameStatus.textContent = '准备中';
                isNetworkGame = false;
                playerRole = null;
                isMyTurn = false;
                alert('已断开服务器连接');
            } else {
                alert('未连接到服务器');
            }
        }
        
        // 创建房间
        function createRoom() {
            connectToServer();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'create_room'
                }));
            } else {
                alert('请先连接服务器');
            }
        }
        
        // 加入房间
        function joinRoom() {
            const roomId = el.roomIdInput.value.trim();
            if (!roomId) {
                alert('请输入房间ID');
                return;
            }
            
            connectToServer();
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'join_room',
                    roomId: roomId
                }));
            } else {
                alert('请先连接服务器');
            }
        }
        
        // 发送游戏操作
        function sendGameAction(action) {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'game_action',
                    action: action
                }));
            }
        }
        
        // 发送状态同步
        function sendSyncState() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'sync_state',
                    history: cfg.history
                }));
            }
        }

        // 页面加载时初始化
        window.addEventListener('load', function() {
            // 不再自动连接，让用户手动输入IP地址连接
            el.connectionStatus.textContent = '未连接';
            el.connectionStatus.style.color = '#d63031';
        });

    </script>

</body>
</html>
