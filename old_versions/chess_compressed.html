<!doctype html>
<html lang=zh-CN>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>圈叉棋</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif;overscroll-behavior:none}body{background:#e8e8e8;min-height:100vh;padding:10px;display:flex;justify-content:center;align-items:flex-start}.game-wrapper{width:100%;max-width:1400px;display:flex;gap:20px}.chessboard-container{flex:1;height:641px;border:2px solid #b8a888;background:#f9f4e8;position:relative;overflow:hidden}.chessboard-scroll{position:absolute;inset:0;overflow:auto;cursor:grab}.chessboard-scroll::-webkit-scrollbar{display:none}#virtualBoardContainer{position:relative;width:calc(80 * 13px);height:calc(80 * 13px)}#chessboard{display:grid;grid-template-columns:repeat(80,12px);grid-template-rows:repeat(80,12px);gap:1px;width:calc(80 * 13px);height:calc(80 * 13px);transform:scale(1);transform-origin:0 0;transition:transform .2s ease;will-change:transform;position:relative}.main-city-corner{position:absolute;z-index:3;pointer-events:none}.main-city-core{position:absolute;z-index:4;pointer-events:none}.sub-sity-area{position:absolute;border:2px solid #8b5a2b;z-index:5;pointer-events:none}.cell{width:12px;height:12px;background:#f9f4e8;display:flex;align-items:center;justify-content:center;font-size:8px;cursor:pointer;border:1px solid #e8d8b8;position:relative;z-index:1}.cell.chess-circle,.cell.chess-cross{color:#8b5a2b;font-weight:700}.cell.chess-mix,.cell.chess-obstacle{color:#8b5a2b}.cell.selected{background:#80c8ff!important}.cell.valid-place{background:#bae7ff!important}.cell.valid-eat{background:#ffccc7!important}.cell.no-place{background:rgba(200,200,200,.3)!important;cursor:not-allowed}.panel-container{display:flex;flex-direction:column;gap:15px;width:280px}.panel{padding:15px;background:#f5f5f5;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.panel h3{font-size:1.1rem;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #ddd;font-weight:400}.info-item{margin:10px 0;display:flex;justify-content:space-between;font-size:14px}.value{font-weight:700;col </head>
<body>
<div class=game-wrapper>
<div class=chessboard-container>
<div class=chessboard-scroll id=scrollArea>
<div id=virtualBoardContainer>
<div id=chessboard></div>
</div>
</div>
</div>
<div class=panel-container>
<div class=panel>
<h3>棋局状态</h3>
<div class=info-item>
<span>当前操作：</span>
<span class=value id=current-action>建✕主城</span>
</div>
<div class=info-item>
<span>棋子数量：</span>
<span>
<span class=value id=circle-count>◯ 0</span> |
<span class=value id=cross-count>✕ 0</span> |
<span class=value id=mix-count>⨂ 0</span>
</span>
</div>
<div class=info-item>
<span>主城：</span>
<span>
<span class=value id=main-circle-count>◯ 1</span> |
<span class=value id=main-cross-count>✕ 1</span>
</span>
</div>
<div class=info-item>
<span>副城：</span>
<span>
<span class=value id=sub-circle-count>◯ 0</span> |
<span class=value id=sub-cross-count>✕ 0</span>
</span>
</div>
<div class=btn-group>
<button onclick=resetGame()>重新开局</button>
<button onclick=undoMove() id=undo-btn disabled>悔棋</button>
<button onclick=calculateEndgame()>结算胜负</button>
</div>
<button class=random-map-btn id=random-map-btn onclick=createRandomCities()>随机地图</button>
<div class="btn-group obstacle-toggle-group">
<input type=checkbox id=obstacleToggle name=obstacleToggle checked>
<label for=obstacleToggle>障碍地形</label>
</div>
</div>
<div class=panel>
<h3>战果统计</h3>
<div class=kill-count>
<span>◯ 方战果：</span>
<span class=kill-value id=circle-kill>0</span>
</div>
<div class=kill-count>
<span>✕ 方战果：</span>
<span class=kill-value id=cross-kill>0</span>
</div>
<div class=winner id=winner-text>- 未结算 -</div>
</div>
<div class=panel>
<h3>棋局记录</h3>
<div class=btn-group>
<button onclick=export_data()>导出棋局</button>
<button onclick=import_data()>载入棋局</button>
</div>
</div>
<div class=zoom-control-wrapper>
<div class="zoom-btn minus" id=zoom-out-btn onclick=zoomOut()>-</div>
<div class=zoom-slider-container>
<div class=zoom-slider id=zoom-slider>
<div class=zoom-fill id=zoom-fill style=width:50%></div>
<div class=zoom-thumb id=zoom-thumb style=left:50%></div>
</div>
</div>
<div class="zoom-btn plus" id=zoom-in-btn onclick=zoomIn()>+</div>
<div class=zoom-display id=zoom-display>100%</div>
</div>
</div>
</div>
