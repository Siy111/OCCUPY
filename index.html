                        for (let nx = startX; nx <= endX; nx++) {
                            this.updateCell(nx, ny);
                        }
                    }
                }
            }

            // 悬停高亮
            drawFlashForCell(x, y) {
                if (!this.flashQueue || this.flashQueue.length === 0) return;
                const now = Date.now();
                const baseCellSize = CONFIG.cell, gapSize = 1;
                const ctx = this.game.ctx;
                for (const e of this.flashQueue) {
                    if (e.expiry > now && e.x === x && e.y === y) {
                        const cellX = x * (baseCellSize + gapSize), cellY = y * (baseCellSize + gapSize);
                        ctx.fillStyle = e.color;
                        ctx.fillRect(cellX, cellY, baseCellSize, baseCellSize);
                        return;
                    }
                }
            }

            updateHoverHighlight() {
                if (this.game.hoverState.x === this.game.hoverState.lastX && this.game.hoverState.y === this.game.hoverState.lastY) return;
                if (this.game.hoverState.lastX !== -1 && this.game.hoverState.lastY !== -1) {
                    this.updateCell(this.game.hoverState.lastX, this.game.hoverState.lastY);
                    this.drawFlashForCell(this.game.hoverState.lastX, this.game.hoverState.lastY);
                }
                if (this.game.hoverState.x !== -1 && this.game.hoverState.y !== -1) {
                    this.updateCell(this.game.hoverState.x, this.game.hoverState.y);
                    this.drawFlashForCell(this.game.hoverState.x, this.game.hoverState.y);
                    const cellX = this.game.hoverState.x * (CONFIG.cell + 1), cellY = this.game.hoverState.y * (CONFIG.cell + 1);
                    this.game.ctx.fillStyle = 'rgba(200, 200, 200, 0.3)';
                    this.game.ctx.fillRect(cellX, cellY, CONFIG.cell, CONFIG.cell);
                }
            }

            // 闪烁队列管理
            flashCell(x, y, color = 'rgba(0,200,0,0.45)', duration = 2000) {
                if (x < 0 || y < 0 || x >= CONFIG.size || y >= CONFIG.size) return;
                const now = Date.now();
                const desiredExpiry = now + duration;
                const expiry = Math.max(desiredExpiry, this.lastScheduledExpiry + 1);
                this.lastScheduledExpiry = expiry;
                const entry = { x, y, color, expiry };
                this.flashQueue.push(entry);
                requestAnimationFrame(() => this.drawBoard());
                if (!this.flashSchedulerTimer && this.flashQueue.length > 0) {
                    const processQueue = () => {
                        this.flashSchedulerTimer = null;
                        const now = Date.now();
                        let removed = false;
                        while (this.flashQueue.length && this.flashQueue[0].expiry <= now) { this.flashQueue.shift(); removed = true; }
                        if (removed) requestAnimationFrame(() => this.drawBoard());
                        if (this.flashQueue.length > 0) {
                            const nextExpiry = this.flashQueue[0].expiry;
                            const delay = Math.max(0, nextExpiry - now);
                            this.flashSchedulerTimer = setTimeout(processQueue, delay + 1);
                        } else { this.lastScheduledExpiry = 0; }
                    };
                    const nextExpiry = this.flashQueue[0].expiry;
                    const delay = Math.max(0, nextExpiry - now);
                    this.flashSchedulerTimer = setTimeout(processQueue, delay + 1);
                }
            }

            flashAction(action, excludeSelect = false) {
                if (!action) return;
                if (action.fromX !== undefined && action.fromY !== undefined)
                    this.flashCell(action.fromX, action.fromY, 'rgba(128, 200, 255, 0.8)', 3000);
                if (action.x === undefined || action.y === undefined) return;

            createHistoryItemElement(index, text) {

            saveHistory(action) {

                    case 'layX': return `✕ 在(${x}, ${y})布子`; case 'layO': return `◯ 在(${x}, ${y})布子`;

            }
        }

        // 视口类（缩放+拖拽）
        class Viewport {
            constructor(game) {
                this.game = game;

                // 拖拽滚动
                let isDragging = false, startX, startY, scrollLeft, scrollTop, dragStartX, dragStartY;
                const DRAG_THRESHOLD = 2;
                const scrollArea = this.game.scrollArea;
                const handleMouseDown = (e) => {
                    isDragging = true; this.game.isClick = true; dragStartX = e.clientX; dragStartY = e.clientY;
                    startX = e.pageX - scrollArea.getBoundingClientRect().left;
                    startY = e.pageY - scrollArea.getBoundingClientRect().top;
                    scrollLeft = scrollArea.scrollLeft; scrollTop = scrollArea.scrollTop;
                    scrollArea.style.cursor = 'grabbing'; document.body.style.userSelect = 'none';
                };
                const handleMouseMove = (e) => {
                    if (!isDragging) return;
                    const distance = Math.sqrt(Math.pow(e.clientX - dragStartX, 2) + Math.pow(e.clientY - dragStartY, 2));
                    if (distance > DRAG_THRESHOLD) this.game.isClick = false;
                    const x = e.pageX - scrollArea.getBoundingClientRect().left, y = e.pageY - scrollArea.getBoundingClientRect().top;
                    const dragRatio = 1 / appState.zoom;
                    scrollArea.scrollLeft = scrollLeft - (x - startX) * dragRatio;
                    scrollArea.scrollTop = scrollTop - (y - startY) * dragRatio;
                };
                const handleMouseUp = () => { if (isDragging) { isDragging = false; scrollArea.style.cursor = 'default'; document.body.style.userSelect = ''; } };
                scrollArea.addEventListener('mousedown', handleMouseDown);
                document.addEventListener('mousemove', handleMouseMove); document.addEventListener('mouseup', handleMouseUp); document.addEventListener('mouseleave', handleMouseUp);

                // 鼠标滚轮缩放（以光标为中心）
                scrollArea.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const rect = scrollArea.getBoundingClientRect();
                    const dy = Math.max(-100, Math.min(100, e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY));
                    const newZoom = Math.max(CONFIG.minZoom, Math.min(CONFIG.maxZoom, appState.zoom * Math.pow(1.1, -dy / 100)));
                    this.setZoom(newZoom, true, e.clientX - rect.left, e.clientY - rect.top);
                }, { passive: false });

                // 双指触摸缩放（中心跟随手指，如同查看图片）
                let pinch = null;
                const gesture = (e) => {
                    const rect = scrollArea.getBoundingClientRect(), [t1, t2] = e.touches;
                    return {
                        dist: Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY),
                        x: (t1.clientX + t2.clientX) / 2 - rect.left,
                        y: (t1.clientY + t2.clientY) / 2 - rect.top
                    };
                };
                const handleTouchStart = (e) => {
                    if (e.touches.length !== 2) return;
                    e.preventDefault();
                    const g = gesture(e);
                    pinch = { zoom: appState.zoom, dist: g.dist, anchor: { x: (g.x + scrollArea.scrollLeft) / appState.zoom, y: (g.y + scrollArea.scrollTop) / appState.zoom } };
                };
                const handleTouchMove = (e) => {
                    if (!pinch || e.touches.length !== 2) return;
                    e.preventDefault();
                    const g = gesture(e);
                    const newZoom = Math.max(CONFIG.minZoom, Math.min(CONFIG.maxZoom, pinch.zoom * (g.dist / pinch.dist)));
                    this.setZoom(newZoom, true, g.x, g.y, pinch.anchor.x, pinch.anchor.y);
                };
                const handleTouchEnd = () => { pinch = null; };
                scrollArea.addEventListener('touchstart', handleTouchStart, { passive: false });
                scrollArea.addEventListener('touchmove', handleTouchMove, { passive: false });
                scrollArea.addEventListener('touchend', handleTouchEnd); scrollArea.addEventListener('touchcancel', handleTouchEnd);

                // 缩放滑块
                let sliderDragging = false;
                const zoomSlider = this.game.zoomSlider;
                const zoomThumb = this.game.zoomThumb;
                const getZoomFromPos = (clientX) => { const rect = zoomSlider.getBoundingClientRect(); let percent = (clientX - rect.left) / rect.width; percent = Math.max(0, Math.min(1, percent)); return CONFIG.minZoom + (CONFIG.maxZoom - CONFIG.minZoom) * percent; };
                const handleThumbDown = (e) => { sliderDragging = true; zoomThumb.style.cursor = 'grabbing'; document.body.style.userSelect = 'none'; e.preventDefault(); };
                const handleSliderClick = (e) => { if (e.target !== zoomThumb) this.setZoom(getZoomFromPos(e.clientX), true); };
                const handleSliderMouseMove = (e) => { if (sliderDragging) this.setZoom(getZoomFromPos(e.clientX), true); };
                const handleSliderMouseUp = () => { if (sliderDragging) { sliderDragging = false; zoomThumb.style.cursor = 'grab'; document.body.style.userSelect = ''; } };
                zoomThumb.addEventListener('mousedown', handleThumbDown);
                zoomSlider.addEventListener('mousedown', handleSliderClick);
                document.addEventListener('mousemove', handleSliderMouseMove); document.addEventListener('mouseup', handleSliderMouseUp); document.addEventListener('touchend', handleSliderMouseUp);
                zoomThumb.addEventListener('touchstart', (e) => { sliderDragging = true; e.preventDefault(); });
                document.addEventListener('touchmove', (e) => { if (!sliderDragging) return; e.preventDefault(); this.setZoom(getZoomFromPos(e.touches[0].clientX), true); }, { passive: false });
            }

            reset() {
                this.setZoom(1);
                this.updateZoomSlider();
                this.game.randomMapBtn.disabled = false;
                this.game.randomCitiesToggle.disabled = false;
                this.game.resourceToggle.disabled = false;
                this.game.scrollArea.scrollLeft = this.game.scrollArea.scrollTop = 0;
                this.game.winnerText.textContent = '- 未结算 -';
            }

            updateZoomSlider() { const percent = ((appState.zoom - CONFIG.minZoom) / (CONFIG.maxZoom - CONFIG.minZoom)) * 100; this.game.zoomFill.style.width = `${percent}%`; this.game.zoomThumb.style.left = `${percent}%`; this.game.zoomValue.textContent = `${Math.round(appState.zoom * 100)}%`; }

            setZoom(level, skipTransition, centerX, centerY, anchorX, anchorY) {
                level = Math.min(CONFIG.maxZoom, Math.max(CONFIG.minZoom, parseFloat(level.toFixed(2))));
                // 指定锚点时即使缩放不变也需更新滚动（双指平移跟随），因此不提前返回
                if (Math.abs(level - appState.zoom) < 0.01 && anchorX === undefined) return;
                const scrollArea = this.game.scrollArea;
                const oldZoom = appState.zoom, oldSl = scrollArea.scrollLeft, oldSt = scrollArea.scrollTop;
                // 缩放锚点：缩放时保持该棋盘坐标点不动（centerX/centerY 为其视口坐标，可省略）
                let ax = anchorX, ay = anchorY;
                if (ax === undefined && centerX !== undefined) { ax = (centerX + oldSl) / oldZoom; ay = (centerY + oldSt) / oldZoom; }
                if (skipTransition) {
                    const bg = this.game.boardBg, canvas = this.game.boardCanvas;
                    bg.classList.remove('zoom-animated'); canvas.classList.remove('zoom-animated');
                    clearTimeout(this._zoomTransitionTimer);
                    this._zoomTransitionTimer = setTimeout(() => { bg.classList.add('zoom-animated'); canvas.classList.add('zoom-animated'); }, 120);
                }
                appState.zoom = level;
                this.game.boardBg.style.transform = `scale(${level})`; this.game.boardCanvas.style.transform = `scale(${level})`;
                this.game.virtualBoardContainer.style.width = `${BASE_BOARD_SIZE * level}px`; this.game.virtualBoardContainer.style.height = `${BASE_BOARD_SIZE * level}px`;
                this.updateZoomSlider();
                if (ax !== undefined && centerX !== undefined) {
                    scrollArea.scrollLeft = ax * level - centerX;
                    scrollArea.scrollTop = ay * level - centerY;
                } else {
                    const ratio = level / oldZoom;
                    scrollArea.scrollLeft = oldSl * ratio;
                    scrollArea.scrollTop = oldSt * ratio;
                }
            }

            zoomIn() { this.game.boardBg.classList.add('zoom-animated'); this.game.boardCanvas.classList.add('zoom-animated'); this.setZoom(appState.zoom + 0.1); }
            zoomOut() { this.game.boardBg.classList.add('zoom-animated'); this.game.boardCanvas.classList.add('zoom-animated'); this.setZoom(appState.zoom - 0.1); }
        }

        // 文件管理类（导出/导入）
        class FileManager {
            constructor(game) {
                this.game = game;
            }

            performExport() {
                const exportData = { meta: { version: "6", timestamp: new Date().toISOString(), buttons: { randomCitiesToggle: this.game.randomCitiesToggle.checked, resourceToggle: this.game.resourceToggle.checked } }, history: this.game.state.history };
                const jsonStr = JSON.stringify(exportData); const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
                const defaultBase = `占城棋_棋局${new Date().getTime()}`; let inputBase = prompt('请输入导出文件名：', defaultBase);
                if (inputBase === null) return; inputBase = inputBase.trim(); if (inputBase === '') inputBase = defaultBase;
                inputBase = inputBase.replace(/[\\\/:*?"<>|]/g, '_');
                const fileName = inputBase.toLowerCase().endsWith('.json') ? inputBase : `${inputBase}.json`;
                const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName; a.click(); URL.revokeObjectURL(a.href);
                alert(`棋局已导出：${fileName}`);
            }

            importData() {
                if (this.game.network.isNetworkGame) {
                    alert('网络对战中不能载入棋局');
                    return;
                }
                const fileInput = document.createElement("input"); fileInput.type = "file"; fileInput.accept = ".json";
                fileInput.onchange = (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const importData = JSON.parse(event.target.result);
                            if (!this.validateImportData(importData)) { alert("导入失败：文件格式错误或数据不完整！"); return; }
                            this.restoreGameState(importData);
                            this.game.renderer.initBoard(); this.game.renderer.drawBoardBg(); this.game.renderer.drawBoard();
                            this.game.viewport.updateZoomSlider(); this.game.recorder.updateDisplay(); alert("棋局导入成功！");
                        } catch (error) { console.error("导入解析失败：", error); alert(`导入失败：${error.message}`); }
                    };
                    reader.readAsText(file);
                };
                fileInput.click();
            }

            validateImportData(data) { if (!data || !data.history) return false; return true; }

            restoreGameState(data) {
                this.game.state.history = data.history || [];
                this.game.replayHistory(this.game.state.history.length - 1);
                this.game.renderer.clearFlashQueue();
                this.game.recorder.renderFullHistory();
                appState.zoom = 1;
                if (data.meta && data.meta.buttons) {
                    if (data.meta.buttons.randomCitiesToggle !== undefined) this.game.randomCitiesToggle.checked = data.meta.buttons.randomCitiesToggle;
                    if (data.meta.buttons.resourceToggle !== undefined) this.game.resourceToggle.checked = data.meta.buttons.resourceToggle;
                }
            }
        }

        // 网络通信类
        class Network {
            constructor(game) {
                this.game = game;
                this.ws = null;
                this.isNetworkGame = false;
                this.playerRole = null;
                this.isMyTurn = false;
                this.serverIp = null;
                this.roomState = null;
                this.isHost = false;
            }

            updateRoleDisplay() {
                this.game.playerRole.textContent = this.isHost ? '房主' : '客人';
            }

            updateRoomButtonsState() {
                const createBtn = this.game.createRoomBtn;
                const joinBtn = this.game.joinRoomBtn;
                if (this.roomState === 'creator') {
                    createBtn.disabled = true;
                    createBtn.textContent = '创建房间';
                    joinBtn.disabled = false;
                    joinBtn.textContent = '关闭房间';
                } else if (this.roomState === 'joiner') {
                    joinBtn.disabled = true;
                    joinBtn.textContent = '加入房间';
                    createBtn.disabled = false;
                    createBtn.textContent = '退出房间';
                } else {
                    createBtn.disabled = false;
                    createBtn.textContent = '创建房间';
                    joinBtn.disabled = false;
                    joinBtn.textContent = '加入房间';
                }
            }

            connectToServer() {
                if (this.ws) { alert('已经连接到服务器'); return; }
                try {
                    const input = prompt('请输入服务器IP及端口:', 'localhost:8080');
                    if (!input) return;
                    let ipPort = input.trim();
                    let serverIp = ipPort, port = 8080;
                    if (ipPort.includes(':')) {
                        const parts = ipPort.split(':');
                        serverIp = parts[0];
                        port = parseInt(parts[1], 10) || 8080;
                    }
                    this.serverIp = serverIp;
                    const statusEl = this.game.connectionStatus;
                    this.ws = new WebSocket(`ws://${serverIp}:${port}`);
                    this.ws.onopen = () => { statusEl.textContent = `${serverIp}:${port}`; statusEl.style.color = '#4CAF50'; };
                    this.ws.onmessage = (event) => { try { this.handleWebSocketMessage(JSON.parse(event.data)); } catch (error) { console.error('消息解析错误:', error); } };
                    this.ws.onclose = () => { statusEl.textContent = '未连接'; statusEl.style.color = '#f44336'; this.ws = null; this.roomState = null; this.isHost = false; this.isNetworkGame = false; this.isMyTurn = false; this.playerRole = null; this.updateRoomButtonsState(); this.game.roomIdInput.value = ''; this.game.roomIdInput.disabled = false; this.game.playerRole.textContent = '未分配'; this.game.gameStatus.textContent = '准备中'; };
                    this.ws.onerror = (error) => { console.error('WebSocket错误:', error); statusEl.textContent = '连接错误'; statusEl.style.color = '#f44336'; };
                } catch (error) { console.error('WebSocket连接失败:', error); this.game.connectionStatus.textContent = '连接失败'; this.game.connectionStatus.style.color = '#f44336'; }
            }

            disconnectServer() {
                if (this.ws) {
                    this.ws.close(); this.ws = null;
                    this.game.connectionStatus.textContent = '未连接'; this.game.connectionStatus.style.color = '#f44336';
                    this.game.playerRole.textContent = '未分配'; this.game.gameStatus.textContent = '准备中';
                    this.isNetworkGame = false; this.playerRole = null; this.isMyTurn = false; this.serverIp = null;
                    this.roomState = null; this.isHost = false;
                    this.updateRoomButtonsState();
                    alert('已断开服务器连接');
                } else { alert('未连接到服务器'); }
            }

            createRoom() {
                if (this.roomState === 'joiner') {
                    this.leaveRoom();
                    return;
                }
                this.connectToServer();
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ type: 'create_room' }));
                } else {
                    alert('请先连接服务器');
                }
            }

            joinRoom() {
                if (this.roomState === 'creator') {
                    this.closeRoom();
                    return;
                }
                const roomId = this.game.roomIdInput.value.trim();
                if (!roomId) { alert('请输入房间ID'); return; }
                this.connectToServer();
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ type: 'join_room', roomId: roomId }));
                } else {
                    alert('请先连接服务器');
                }
            }

            closeRoom() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ type: 'close_room' }));
                }
                this.roomState = null;
                this.isHost = false;
                this.isNetworkGame = false;
                this.isMyTurn = false;
                this.playerRole = null;
                this.updateRoomButtonsState();
                this.game.roomIdInput.value = ''; this.game.roomIdInput.disabled = false;
                this.game.gameStatus.textContent = '准备中';
                this.game.playerRole.textContent = '未分配';
            }

            leaveRoom() {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify({ type: 'leave_room' }));
                }
                this.roomState = null;
                this.isHost = false;
                this.isNetworkGame = false;
                this.isMyTurn = false;
                this.playerRole = null;
                this.updateRoomButtonsState();
                this.game.roomIdInput.value = ''; this.game.roomIdInput.disabled = false;
                this.game.gameStatus.textContent = '准备中';
                this.game.playerRole.textContent = '未分配';
            }

            sendGameAction(action) { if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify({ type: 'game_action', action: action })); } }

            handleWebSocketMessage(data) {
                switch (data.type) {
                    case 'room_created':
                        this.roomState = 'creator';
                        this.isHost = true;
                        this.updateRoomButtonsState();
                        this.game.roomIdInput.value = data.roomId; this.game.roomIdInput.disabled = true; this.game.gameStatus.textContent = '等待对手加入';
                        this.game.playerRole.textContent = '房主（等待对手）';
                        alert(`房间创建成功！房间ID: ${data.roomId}`);
                        break;
                    case 'room_joined':
                        this.roomState = data.isHost ? 'creator' : 'joiner';
                        this.isHost = data.isHost;
                        this.updateRoomButtonsState();
                        this.game.gameStatus.textContent = '游戏准备中';
                        this.game.playerRole.textContent = this.isHost ? '房主（重新加入）' : '客人（等待同步）';
                        break;
                    case 'player_joined':
                        this.game.gameStatus.textContent = '游戏准备中'; alert('对手已加入');
                        break;
                    case 'game_start': this.handleGameStart(data); break;
                    case 'game_continue':
                        alert('游戏继续');
                        if (data.role) { this.playerRole = data.role; this.updateRoleDisplay(); }
                        break;
                    case 'game_action': this.handleGameAction(data); break;
                    case 'sync_request':
                        if (this.ws && this.ws.readyState === WebSocket.OPEN) { this.ws.send(JSON.stringify({ type: 'sync_response', history: this.game.state.history, isMyTurn: !this.isMyTurn })); }
                        this.game.gameStatus.textContent = this.isMyTurn ? '轮到你' : '等待对手';
                        break;
                    case 'sync_state': this.handleSyncState(data); break;
                    case 'player_left':
                        alert('对手离开了游戏'); this.game.gameStatus.textContent = '对手离开';
                        this.roomState = null;
                        this.isHost = false;
                        this.isNetworkGame = false;
                        this.isMyTurn = false;
                        this.playerRole = null;
                        this.game.playerRole.textContent = '未分配';
                        this.game.roomIdInput.value = ''; this.game.roomIdInput.disabled = false;
                        this.updateRoomButtonsState();
                        break;
                    case 'error':
                        alert('错误: ' + data.message);
                        break;
                    default: break;
                }
            }

            handleGameStart(data) {
                this.playerRole = data.role;
                this.isNetworkGame = true;
                this.updateRoleDisplay();
                if (data.role === 'first_player') { this.isMyTurn = true; alert('你是先手，请开始游戏'); } else { this.isMyTurn = false; alert('你是后手，等待先手操作'); }
                this.game.gameStatus.textContent = this.isMyTurn ? '轮到你' : '等待对手';
            }

            handleRequestReply(msg, replyOpt, onAgree, extraReplyFields = {}) {
                if (confirm(msg)) {
                    this.sendGameAction({ opt: replyOpt, reply: true, ...extraReplyFields });
                    onAgree(); {
                    }
                } else {
                    this.sendGameAction({ opt: replyOpt, reply: false });
                }
            }

            handleGameAction(data) {
                const action = data.action;
                switch (action.opt) {
                    case 'mainX': case 'mainO': case 'subX': case 'subO': this.game.actionProcessor.processBuild(action.x, action.y, true); this.isMyTurn = false; this.game.recorder.updateDisplay(true); break;
                    case 'layX': this.game.actionProcessor.processLay(action.x, action.y, true); this.isMyTurn = false; this.game.recorder.updateDisplay(true); break;
                    case 'layO': this.game.actionProcessor.processLay(action.x, action.y, true); this.isMyTurn = true; this.game.recorder.updateDisplay(true); break;
                    case 'choose': this.game.actionProcessor.processChoose(action.x, action.y, true); this.isMyTurn = false; this.game.recorder.updateDisplay(true); break;
                    case 'x-place': case 'o-place': this.game.actionProcessor.processPlace(action.x, action.y, true); this.isMyTurn = true; this.game.recorder.updateDisplay(true); break;
                    case 'x-eat': case 'o-eat': this.game.actionProcessor.processEat(action.x, action.y, true); this.isMyTurn = true; this.game.recorder.updateDisplay(true); break;
                    case 'resources':
                        this.game.actionProcessor.processResources(action.resources);
                        break;
                    case 'res':
                        this.game.actionProcessor.processResourceEdit(action.x, action.y, 'resource');
                        break;
                    case 'eptRes':
                        this.game.actionProcessor.processResourceEdit(action.x, action.y, 'empty');
                        break;
                    case 'select': this.game.actionProcessor.processSelect(action.x, action.y); this.isMyTurn = false; break;
                    case 'undo':
                        this.handleRequestReply('对手请求悔棋，是否同意？', 'undo-reply',
                            () => { this.game.performUndo(action.historyLength - 1); this.isMyTurn = false; },
                            { historyLength: action.historyLength });
                        break;
                    case 'undo-reply':
                        if (action.reply) { this.game.performUndo(action.historyLength - 1); this.isMyTurn = true; this.game.recorder.updateDisplay(true); } else { alert('对手拒绝悔棋'); }
                        break;
                    case 'restart':
                        this.handleRequestReply('对手请求重新开局，是否同意？', 'restart-reply',
                            () => { this.game.init(); this.isMyTurn = this.playerRole === 'first_player'; this.game.recorder.updateDisplay(true); });
                        break;
                    case 'restart-reply':
                        if (action.reply) { this.game.init(); this.isMyTurn = this.playerRole === 'first_player'; this.game.recorder.updateDisplay(true); } else { alert('对手拒绝重新开局'); }
                        break;
                    case 'calculate':
                        this.handleRequestReply('对手请求结算胜负，是否同意？', 'calculate-reply',
                            () => { this.game.actionProcessor.calculateEndgame(); });
                        break;
                    case 'calculate-reply':
                        if (action.reply) { this.game.actionProcessor.calculateEndgame(); } else { alert('对手拒绝结算胜负'); }
                        break;
                    case 'export':
                        this.handleRequestReply('对手请求导出棋局，是否同意？', 'export-reply',
                            () => { this.game.fileManager.performExport(); });
                        break;
                    case 'export-reply':
                        if (action.reply) { this.game.fileManager.performExport(); } else { alert('对手拒绝导出棋局'); }
                        break;
                }
                this.game.renderer.flashAction(action, true);
                this.game.gameStatus.textContent = this.isMyTurn ? '轮到你' : '等待对手';
            }

            handleSyncState(data) {
                if (data.history) { this.game.state.history = data.history; this.game.replayHistory(this.game.state.history.length - 1); }
                if (data.isMyTurn !== undefined) this.isMyTurn = data.isMyTurn;
                this.isNetworkGame = true;
                this.game.recorder.renderFullHistory();
                this.game.renderer.initBoard(); this.game.renderer.drawBoardBg(); this.game.renderer.drawBoard();
                this.game.recorder.updateDisplay();
            }
        }

        // 创建全局游戏实例
        let game;
        window.onload = function() {
            game = new Game();
        };
    </script>
</body>
</html>
