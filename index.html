                });
            }

            updateValidAreas(x, y) {
                if (x === undefined || y === undefined) return;
                const maxRange = Math.max(CONFIG.RANGE.PLACE, CONFIG.RANGE.EAT) + 1;
                const startX = Math.max(0, x - maxRange);
                const endX = Math.min(CONFIG.size - 1, x + maxRange);
                const startY = Math.max(0, y - maxRange);
                const endY = Math.min(CONFIG.size - 1, y + maxRange);
                
                for (let ny = startY; ny <= endY; ny++) {
                    for (let nx = startX; nx <= endX; nx++) {
                        this.updateCell(nx, ny);
                    }
                }
            }

            // 悬停高亮
            updateHoverHighlight() {
                const { x: hoverX, y: hoverY, lastX, lastY } = this.game.hoverState;
                if (hoverX === lastX && hoverY === lastY) return;
                
                const { CELL_SIZE, COLORS } = Renderer;
                const ctx = this.game.ctx;
                
                // 清除旧悬停位置
                if (lastX !== -1 && lastY !== -1) {
                    this.updateCell(lastX, lastY);
                }
                
                // 绘制新悬停位置
                if (hoverX !== -1 && hoverY !== -1) {
                    this.updateCell(hoverX, hoverY);
                    const { cellX, cellY } = Renderer.getCellPos(hoverX, hoverY);
                    ctx.fillStyle = COLORS.HOVER;
                    ctx.fillRect(cellX, cellY, CELL_SIZE, CELL_SIZE);
                }
            }

            // 闪烁队列管理
            flashCell(x, y, color = Renderer.COLORS.FLASH, duration = 2000) {
                if (x < 0 || y < 0 || x >= CONFIG.size || y >= CONFIG.size) return;
                const now = Date.now();
                const expiry = Math.max(now + duration, this.lastScheduledExpiry + 1);
                this.lastScheduledExpiry = expiry;
                this.flashQueue.push({ x, y, color, expiry });
                // 重绘该格（闪烁色作为底色画在棋子下方）
                this.updateCell(x, y);
                
                // 安排清理定时器
                if (!this.flashSchedulerTimer && this.flashQueue.length > 0) {
                    const processQueue = () => {
                        this.flashSchedulerTimer = null;
                        const now = Date.now();
                        let removed = [];
                        while (this.flashQueue.length && this.flashQueue[0].expiry <= now) { 
                            removed.push(this.flashQueue.shift()); 
                        }
                        if (removed.length > 0) {
                            // 只重绘过期闪烁的格子，恢复原状
                            requestAnimationFrame(() => {
                                for (const { x, y } of removed) {
                                    this.updateCell(x, y);
                                }
                            });
                        }
                        if (this.flashQueue.length > 0) {
                            const nextExpiry = this.flashQueue[0].expiry;
                            this.flashSchedulerTimer = setTimeout(processQueue, Math.max(0, nextExpiry - now) + 1);
                        } else { 
                            this.lastScheduledExpiry = 0; 
                        }
                    };
                    const nextExpiry = this.flashQueue[0].expiry;
                    this.flashSchedulerTimer = setTimeout(processQueue, Math.max(0, nextExpiry - Date.now()) + 1);
                }
            }

            flashAction(action, excludeSelect = false) {
                const { COLORS } = Renderer;
                if (!action) return;
                if (action.fromX !== undefined && action.fromY !== undefined)
                    this.flashCell(action.fromX, action.fromY, COLORS.SELECTED, 3000);
                if (action.x === undefined || action.y === undefined) return;
                const color = (action.opt === 'x-eat' || action.opt === 'o-eat') 
                    ? COLORS.EAT
                    : ((action.opt !== 'select' || !excludeSelect) ? COLORS.FLASH : null);
                if (color) this.flashCell(action.x, action.y, color, 3000);
            }

            clearFlashQueue() {
                if (this.flashQueue.length > 0) {
                    // 只重绘闪烁过的格子
                    requestAnimationFrame(() => {
                        for (const { x, y } of this.flashQueue) {
                            this.updateCell(x, y);
                        }
                    });
                }
                this.flashQueue = [];
                if (this.flashSchedulerTimer) { 
                    clearTimeout(this.flashSchedulerTimer); 
                    this.flashSchedulerTimer = null; 
                }
                this.lastScheduledExpiry = 0;
            }
        }

        // 记录器类（历史记录+DOM更新）
        class Recorder {
            constructor(game) {
                this.game = game;
                this.historyListEl = document.getElementById('history-list');
            }

            reset() {
                this.renderFullHistory();
                this.game.undoBtn.disabled = true;
            }

            updateDisplay(saveHistoryFlag = true) {
                const actionMap = { 'x-main': '建✕主城', 'o-main': '建◯主城', 'x-sub': '建副城', 'o-sub': '建副城', 'choose': '选先手', 'x-lay': '✕方置子', 'o-lay': '◯方置子', 'x-game': '✕方', 'o-game': '◯方' };
                let circle = 0, cross = 0, mix = 0;
                for (let y = 0; y < CONFIG.size; y++) {
                    for (let x = 0; x < CONFIG.size; x++) {
                        switch (this.game.state.grid[y][x].type) { case 'circle': circle++; break; case 'cross': cross++; break; case 'mix': mix++; break; }
                    }
                }
                this.game.stats = { ...this.game.stats, circle, cross, mix };
                if (saveHistoryFlag) {
                    this.game.currentAction.textContent = actionMap[this.game.state.buildPhase] || '';
                    const mainCross = this.game.state.mainCities.filter(city => city.owner === 'cross' && !city.lost).length;
                    const mainCircle = this.game.state.mainCities.filter(city => city.owner === 'circle' && !city.lost).length;
                    const subCircle = this.game.state.subCities.filter(city => city.occupied === 'circle' && !city.lost).length;
                    const subCross = this.game.state.subCities.filter(city => city.occupied === 'cross' && !city.lost).length;
                    this.game.circleCount.textContent = `◯ ${circle}`;
                    this.game.crossCount.textContent = `✕ ${cross}`;
                    this.game.mixCount.textContent = `⨂ ${mix}`;
                    this.game.mainCircleCount.textContent = `◯ ${mainCircle}`;
                    this.game.mainCrossCount.textContent = `✕ ${mainCross}`;
                    this.game.subCircleCount.textContent = `◯ ${subCircle}`;
                    this.game.subCrossCount.textContent = `✕ ${subCross}`;
                    this.game.undoBtn.disabled = this.game.state.history.length <= 1;
                    this.game.gameStatus.textContent = this.game.network.isMyTurn ? '轮到你' : '等待对手';
                }
            }

            createHistoryItemElement(index, text) {
                const item = document.createElement('div');
                item.textContent = `${index}. ${text}`;
                item.style.padding = '6px 8px';
                item.style.borderBottom = '1px solid #eee';
                item.style.cursor = 'pointer';
                item.dataset.index = index;
                item.addEventListener('click', (e) => this.handleHistoryItemClick(e));
                return item;
            }

            saveHistory(action) {
                this.game.state.history.push(action);
                if (this.historyListEl) {
                    const index = this.game.state.history.length - 1;
                    const text = this.formatHistoryEntry(action, index);
                    const item = this.createHistoryItemElement(index, text);
                    this.historyListEl.insertBefore(item, this.historyListEl.firstChild);
                    this.historyListEl.scrollTop = 0;
                }
            }

            handleHistoryItemClick(e) {
                const index = parseInt(e.target.dataset.index);
                if (isNaN(index)) return;
                const action = this.game.state.history[index];
                this.game.renderer.flashAction(action);
            }

            formatHistoryEntry(action, idx) {
                if (!action || !action.opt) return '未知操作';
                const opt = action.opt, x = action.x, y = action.y;
                switch (opt) {
                    case 'mainX': return `在(${x}, ${y})建✕主城`; case 'mainO': return `在(${x}, ${y})建◯主城`;
                    case 'subX': return `在(${x}, ${y})建✕副城`; case 'subO': return `在(${x}, ${y})建◯副城`;
                    case 'resources': return `资源点 (${(action.resources || []).length}个)`;
                    case 'res': return `在(${x}, ${y})放置资源点`; case 'eptRes': return `在(${x}, ${y})移除资源点`;
                    case 'layX': return `✕ 在(${x}, ${y})布子`; case 'layO': return `◯ 在(${x}, ${y})布子`;
                    case 'choose': return `先手选择 ${action.player || action.firstPlayer || ''} 方`;
                    case 'x-place': return `✕ 方走子到(${x}, ${y})`; case 'o-place': return `◯ 方走子到(${x}, ${y})`;
                    case 'x-eat': return `✕ 方吃子于(${x}, ${y})`; case 'o-eat': return `◯ 方吃子于(${x}, ${y})`;
                    case 'select': return `选中(${x}, ${y})`;
                    case 'undo': return `请求悔棋`; case 'restart': return `请求重新开局`; case 'calculate': return `请求结算胜负`; case 'export': return `请求导出棋局`;
                    default: return `${opt} ${x !== undefined && y !== undefined ? `(${x}, ${y})` : ''}`;
                }
            }

            renderFullHistory() {
                if (!this.historyListEl) return;
                this.historyListEl.innerHTML = '';
                for (let i = this.game.state.history.length - 1; i >= 0; i--) {
                    const action = this.game.state.history[i];
                    const text = this.formatHistoryEntry(action, i);
                    const item = this.createHistoryItemElement(i, text);
                    this.historyListEl.appendChild(item);
                }
                this.historyListEl.scrollTop = 0;
            }
        }

        // 视口类（缩放+拖拽）
        class Viewport {
            static EDGE_MARGIN = 80; // 棋盘至少保留该宽度（px）在视口内，防止拖丢
            static MAX_OVER = 80; // 最大越界像素（拖拽弹性与飞界软墙共用，保证回弹手感一致）
            static clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
            // 线性橡皮筋：越界按固定比例跟手，且视觉越界不超过 MAX_OVER
            static elastic(v, min, max) {
                const over = v < min ? min - v : v > max ? v - max : 0;

                const k = Math.min(over * 0.15, Viewport.MAX_OVER);

                    this._settleSeq = (this._settleSeq || 0) + 1; // 取消进行中的仿真

                    startX = e.pageX - scrollArea.getBoundingClientRect().left;
                    startY = e.pageY - scrollArea.getBoundingClientRect().top;
                    startPanX = appState.panTarget.x; startPanY = appState.panTarget.y; // 目标坐标，保证仿真中断时仍 1:1

                    if (!isDragging) return;

                    const x = e.pageX - scrollArea.getBoundingClientRect().left, y = e.pageY - scrollArea.getBoundingClientRect().top;
                    // 记录速度（惯性用）：指数平滑，降低末帧抖动的敏锐度
                    const now = performance.now();
                    if (lastT && now - lastT < 100) {
                        velX = velX * 0.7 + ((x - lastX) / (now - lastT)) * 0.3;
                        velY = velY * 0.7 + ((y - lastY) / (now - lastT)) * 0.3;
                    }
                    lastX = x; lastY = y; lastT = now;
                    // 1:1 跟手拖动：目标位置不压缩，视觉位置统一由弹性映射（越界压缩且封顶）
                    const r = this.panRange(appState.zoom);
                    appState.panTarget.x = startPanX + (x - startX);
                    appState.panTarget.y = startPanY + (y - startY);
                    appState.pan.x = Viewport.elastic(appState.panTarget.x, r.x[0], r.x[1]);
                    appState.pan.y = Viewport.elastic(appState.panTarget.y, r.y[0], r.y[1]);

                };
                const handleMouseUp = () => {
                    if (isDragging) {
                        isDragging = false; scrollArea.style.cursor = 'default'; document.body.style.userSelect = '';

                    }

                scrollArea.addEventListener('mousedown', handleMouseDown);
                document.addEventListener('mousemove', handleMouseMove); document.addEventListener('mouseup', handleMouseUp); document.addEventListener('mouseleave', handleMouseUp);

                    e.preventDefault();

                    const dy = Math.max(-100, Math.min(100, e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY));

                        y: (t1.clientY + t2.clientY) / 2 - rect.top

                };

                    this._settleSeq = (this._settleSeq || 0) + 1; // 取消进行中的仿真
                    this.game.isClick = true; // 防御：个别浏览器 click 与 isClick 复位时序错位
                    if (e.touches.length === 1) {
                        pinch = null; // 单指开始时清除双指状态，避免脏基准
                        const t = e.touches[0];
                        touchPan = { sx: t.clientX, sy: t.clientY, panX: appState.panTarget.x, panY: appState.panTarget.y, tx: t.clientX, ty: t.clientY, tt: performance.now() };
                    } else if (e.touches.length === 2) {
                        touchPan = null; // 双指开始时清除单指状态，避免脏基准
                        const g = gesture(e);
                        pinch = { zoom: appState.zoom, dist: g.dist };
                    }
                };
                const handleTouchMove = (e) => {
                    if (touchPan && e.touches.length === 1) {
                        const t = e.touches[0];
                        // 拖动超过容差则视为拖动而非点击（Android 官方 TouchSlop 8dp，按 CSS px 计取 8）
                        if (Math.hypot(t.clientX - touchPan.sx, t.clientY - touchPan.sy) > 8) this.game.isClick = false;
                        const now = performance.now();
                        if (now - touchPan.tt < 100) {
                            velX = velX * 0.7 + ((t.clientX - touchPan.tx) / (now - touchPan.tt)) * 0.3;
                            velY = velY * 0.7 + ((t.clientY - touchPan.ty) / (now - touchPan.tt)) * 0.3;
                        }
                        touchPan.tx = t.clientX; touchPan.ty = t.clientY; touchPan.tt = now;
                        // 1:1 跟手拖动：目标位置不压缩，视觉位置统一由弹性映射（越界压缩且封顶）
                        const r = this.panRange(appState.zoom);
                        appState.panTarget.x = touchPan.panX + (t.clientX - touchPan.sx);
                        appState.panTarget.y = touchPan.panY + (t.clientY - touchPan.sy);
                        appState.pan.x = Viewport.elastic(appState.panTarget.x, r.x[0], r.x[1]);
                        appState.pan.y = Viewport.elastic(appState.panTarget.y, r.y[0], r.y[1]);
                        this.render();
                    } else if (pinch && e.touches.length === 2) {

                const handleTouchEnd = () => {
                    const panEnded = !pinch && touchPan; // 仅单指平移结束时触发仿真
                    pinch = null; touchPan = null;
                    if (panEnded) this.simulate(velX, velY);
                    velX = velY = 0;
                };
                scrollArea.addEventListener('touchstart', handleTouchStart);
                scrollArea.addEventListener('touchmove', handleTouchMove);
                scrollArea.addEventListener('touchend', handleTouchEnd); scrollArea.addEventListener('touchcancel', handleTouchEnd);

                // 缩放滑块（以视口中心为缩放锚点）
                let sliderDragging = false;
                const zoomSlider = this.game.zoomSlider;
                const zoomThumb = this.game.zoomThumb;
                const getZoomFromPos = (clientX) => { const rect = zoomSlider.getBoundingClientRect(); return CONFIG.minZoom + (CONFIG.maxZoom - CONFIG.minZoom) * Viewport.clamp((clientX - rect.left) / rect.width, 0, 1); };
                const zoomAtCenter = (level) => this.setZoom(level, scrollArea.clientWidth / 2, scrollArea.clientHeight / 2);
                const handleThumbDown = (e) => { sliderDragging = true; zoomThumb.style.cursor = 'grabbing'; document.body.style.userSelect = 'none'; e.preventDefault(); };
                const handleSliderClick = (e) => { if (e.target !== zoomThumb) zoomAtCenter(getZoomFromPos(e.clientX)); };
                const handleSliderMouseMove = (e) => { if (sliderDragging) zoomAtCenter(getZoomFromPos(e.clientX)); };
                const handleSliderMouseUp = () => { if (sliderDragging) { sliderDragging = false; zoomThumb.style.cursor = 'grab'; document.body.style.userSelect = ''; } };
                zoomThumb.addEventListener('mousedown', handleThumbDown);
                zoomSlider.addEventListener('mousedown', handleSliderClick);
                document.addEventListener('mousemove', handleSliderMouseMove); document.addEventListener('mouseup', handleSliderMouseUp); document.addEventListener('touchend', handleSliderMouseUp);
                zoomThumb.addEventListener('touchstart', (e) => { sliderDragging = true; e.preventDefault(); });
                document.addEventListener('touchmove', (e) => { if (!sliderDragging) return; e.preventDefault(); zoomAtCenter(getZoomFromPos(e.touches[0].clientX)); }, { passive: false });

                // 窗口尺寸变化：刷新裁剪区域，越界的 pan 由仿真平滑弹回
                window.addEventListener('resize', () => {
                    this.render();
                    appState.panTarget.x = appState.pan.x; appState.panTarget.y = appState.pan.y; // 目标对齐视觉，供弹簧拉回
                    this.simulate(0, 0);
                });
            }

            reset() {
                this._settleSeq = (this._settleSeq || 0) + 1; // 中断进行中的仿真
                const vw = this.game.scrollArea.clientWidth, vh = this.game.scrollArea.clientHeight;
                appState.pan.x = (vw - BASE_BOARD_SIZE) / 2;
                appState.pan.y = (vh - BASE_BOARD_SIZE) / 2;
                appState.panTarget.x = appState.pan.x; appState.panTarget.y = appState.pan.y; // 同步目标
                this.applyZoom(1); // 重置缩放并渲染（applyZoom 内部已 render）
                this.game.randomMapBtn.disabled = false;
                this.game.randomCitiesToggle.disabled = false;
                this.game.resourceToggle.disabled = false;
            }

            updateZoomSlider() { const percent = ((appState.zoom - CONFIG.minZoom) / (CONFIG.maxZoom - CONFIG.minZoom)) * 100; this.game.zoomFill.style.width = `${percent}%`; this.game.zoomThumb.style.left = `${percent}%`; this.game.zoomValue.textContent = `${Math.round(appState.zoom * 100)}%`; }

            setZoom(level, centerX, centerY) {
                level = Viewport.clamp(parseFloat(level.toFixed(2)), CONFIG.minZoom, CONFIG.maxZoom);
                if (Math.abs(level - appState.zoom) < 0.01) return;
                const pan = appState.pan, z0 = appState.zoom;
                if (centerX !== undefined) {
                    // 缩放锚点：保持视口坐标 (centerX, centerY) 处的棋盘点不动
                    pan.x = centerX - (centerX - pan.x) * level / z0;
                    pan.y = centerY - (centerY - pan.y) * level / z0;
                }
                // 缩放后直接回正到边界内（而非橡皮筋），避免锚点持续漂移
                const r = this.panRange(level);
                pan.x = Viewport.clamp(pan.x, r.x[0], r.x[1]);
                pan.y = Viewport.clamp(pan.y, r.y[0], r.y[1]);
                appState.panTarget.x = pan.x; appState.panTarget.y = pan.y; // 同步目标
                this.applyZoom(level);
            }

            // 允许的 pan 范围：棋盘四周至少保留 Viewport.EDGE_MARGIN 在视口内（防拖丢）
            panRange(z) {
                const vw = this.game.scrollArea.clientWidth, vh = this.game.scrollArea.clientHeight;
                const bw = BASE_BOARD_SIZE * z, bh = BASE_BOARD_SIZE * z;
                const range = (dim, b) => {
                    let min = Viewport.EDGE_MARGIN - b, max = dim - Viewport.EDGE_MARGIN;
                    if (min > max) { const mid = (min + max) / 2; min = max = mid; } // 棋盘比视口小很多时取中点
                    return [min, max];
                };
                return { x: range(vw, bw), y: range(vh, bh) };
            }

            // 松手后的仿真：统一物理模型——弹簧作用于目标位置，视觉由弹性映射压缩（拖拽与飞界同一算法）
            simulate(vx, vy) {
                const r = this.panRange(appState.zoom);
                const id = this._settleSeq = (this._settleSeq || 0) + 1;
                const v = { x: vx * 1000, y: vy * 1000 }; // px/ms → px/s
                const FRICTION = 10, DAMP = 14, SPRING = 40; // 界内摩擦 / 界外阻尼 / 回弹力
                let lastT = performance.now();
                const step = (now) => {
                    if (this._settleSeq !== id) return; // 已被新手势打断
                    const dt = Math.min(now - lastT, 50) / 1000; // 秒，上限 50ms 防跳帧
                    lastT = now;
                    let settled = true; // 两轴是否都基本回到界内
                    for (const axis of ['x', 'y']) {
                        const [lo, hi] = r[axis];
                        const o = appState.panTarget[axis] > hi ? appState.panTarget[axis] - hi : appState.panTarget[axis] < lo ? appState.panTarget[axis] - lo : 0;
                        if (Math.abs(o) > 0.5) settled = false;
                        v[axis] -= ((Math.abs(o) > 0.01 ? DAMP : FRICTION) * v[axis] + SPRING * o) * dt; // 阻尼/摩擦 + 弹簧拉回
                        appState.panTarget[axis] += v[axis] * dt;
                        appState.pan[axis] = Viewport.elastic(appState.panTarget[axis], lo, hi); // 视觉 = 弹性映射
                    }
                    this.render();
                    if (Math.hypot(v.x, v.y) < 1 && settled) return; // 停稳（elastic 界内恒等，pan 已对齐）
                    requestAnimationFrame(step);
                };
                requestAnimationFrame(step);
            }

            applyZoom(z) {
                appState.zoom = z;
                this.updateZoomSlider();
                this.render();
            }

            // 按当前 zoom+pan 渲染：pan 完全自由，棋盘任意位置均可显示（超出视口部分被裁剪）
            render() {
                const scrollArea = this.game.scrollArea;
                const z = appState.zoom, pan = appState.pan;
                // 虚拟容器恒等于视口大小（仅尺寸变化时写入，避免动画期间反复设置 style）
                const vw = scrollArea.clientWidth, vh = scrollArea.clientHeight;
                if (this._vw !== vw || this._vh !== vh) {
                    this._vw = vw; this._vh = vh;
                    this.game.virtualBoardContainer.style.width = `${vw}px`;
                    this.game.virtualBoardContainer.style.height = `${vh}px`;
                }
                const t = `translate(${pan.x}px, ${pan.y}px) scale(${z})`;
                this.game.boardBg.style.transform = t;
                this.game.boardCanvas.style.transform = t;
            }

            zoomIn() { const a = this.game.scrollArea; this.setZoom(appState.zoom + 0.1, a.clientWidth / 2, a.clientHeight / 2); }
            zoomOut() { const a = this.game.scrollArea; this.setZoom(appState.zoom - 0.1, a.clientWidth / 2, a.clientHeight / 2); }
        }

        // 文件管理类（导出/导入）
        class FileManager {
            constructor(game) {
                this.game = game;
            }

            performExport() {
                const exportData = { meta: { version: "6", timestamp: new Date().toISOString() }, history: this.game.state.history };
                const jsonStr = JSON.stringify(exportData); const blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
                const defaultBase = `占城棋_棋局${new Date().getTime()}`; let inputBase = prompt('请输入导出文件名：', defaultBase);
                if (inputBase === null) return; inputBase = inputBase.trim(); if (inputBase === '') inputBase = defaultBase;
                inputBase = inputBase.replace(/[\\\/:*?"<>|]/g, '_');
                const fileName = inputBase.toLowerCase().endsWith('.json') ? inputBase : `${inputBase}.json`;
                const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = fileName; a.click(); URL.revokeObjectURL(a.href);
                alert(`棋局已导出：${fileName}`);
            }

            importData() {
                if (this.game.network.isNetworkGame) {
                    alert('网络对战中不能载入棋局');
                    return;
                }
                const fileInput = document.createElement("input"); fileInput.type = "file"; fileInput.accept = ".json";
                fileInput.onchange = (e) => {
                    const file = e.target.files[0]; if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        try {
                            const importData = JSON.parse(event.target.result);
                            if (!this.validateImportData(importData)) { alert("导入失败：文件格式错误或数据不完整！"); return; }
                            this.restoreGameState(importData);
                            this.game.renderer.initBoard(); this.game.renderer.drawBoard();
                            this.game.recorder.updateDisplay(); alert("棋局导入成功！");
                        } catch (error) { console.error("导入解析失败：", error); alert(`导入失败：${error.message}`); }
                    };
                    reader.readAsText(file);
                };
                fileInput.click();
            }

            validateImportData(data) { if (!data || !data.history) return false; return true; }

            restoreGameState(data) {
                this.game.state.history = data.history || [];
                this.game.replayHistory(this.game.state.history.length - 1);
                this.game.renderer.clearFlashQueue();
                this.game.recorder.renderFullHistory();
                const a = this.game.scrollArea;
                this.game.viewport.setZoom(1, a.clientWidth / 2, a.clientHeight / 2);
            }
        }

        // 网络通信类
        class Network {
            constructor(game) {
                this.game = game;
                this.ws = null;
                this.isNetworkGame = false;
                this.playerRole = null;
                this.isMyTurn = false;
                this.serverIp = null;
                this.serverPort = null;
                this.roomState = null;
                this.isHost = false;
                this.roomId = null;
                this.opponentGone = false;
                this._intentionalClose = false;
                this._reconnectTimer = null;
            }

            updateRoleDisplay() {
                this.game.playerRole.textContent = this.isHost ? '房主' : '客人';
            }

            updateRoomButtonsState() {
                const BtnA = this.game.createRoomBtn;
                const BtnB = this.game.joinRoomBtn;
                if (this.roomState === 'creator') {
                    BtnA.disabled = true;
                    BtnA.textContent = '创建房间';
                    BtnB.disabled = false;
                    BtnB.textContent = '关闭房间';
                } else if (this.roomState === 'joiner') {
                    BtnB.disabled = true;
                    BtnB.textContent = '加入房间';
                    BtnA.disabled = false;
                    BtnA.textContent = '退出房间';
                } else {
                    BtnA.disabled = false;
                    BtnA.textContent = '创建房间';
                    BtnB.disabled = false;
                    BtnB.textContent = '加入房间';
                }
            }

            // 重置房间状态与身份显示
            resetRoom() {
                this.roomState = null;
                this.isHost = false;
                this.isNetworkGame = false;
                this.isMyTurn = false;
                this.playerRole = null;
                this.roomId = null;
                this.opponentGone = false;
                this.game.roomIdInput.value = ''; this.game.roomIdInput.disabled = false;
                this.game.playerRole.textContent = '未分配';
                this.game.gameStatus.textContent = '准备中';
                this.game.randomMapBtn.disabled = false; // 退出对战后恢复随机地图
                this.updateRoomButtonsState();
            }

            connectToServer(onConnected) {
                if (this.ws) { alert('已经连接到服务器'); return; }
                const input = prompt('请输入服务器IP及端口:', 'localhost:8080');
                if (!input) return;
                let ipPort = input.trim();
                let serverIp = ipPort, port = 8080;
                if (ipPort.includes(':')) {
                    const parts = ipPort.split(':');
                    serverIp = parts[0];
                    port = parseInt(parts[1], 10) || 8080;
                }
                this.openSocket(serverIp, port, false, onConnected);
            }

            openSocket(serverIp, port, isReconnect = false, onConnected = null) {
                this.serverIp = serverIp;
                this.serverPort = port;
                this._intentionalClose = false;
                clearTimeout(this._reconnectTimer);
                const statusEl = this.game.connectionStatus;
                try {
                    this.ws = new WebSocket(`ws://${serverIp}:${port}`);
                    this.ws.onopen = () => {
                        statusEl.textContent = `${serverIp}:${port}`;
                        statusEl.style.color = '#4CAF50';
                        this.game.gameStatus.textContent = '已连接';
                        if (onConnected) onConnected();
                        // 断线重连后自动恢复房间
                        if (this.roomId) { this.sendWs({ type: 'join_room', roomId: this.roomId }); }
                    };
                    this.ws.onmessage = (event) => { try { this.handleWebSocketMessage(JSON.parse(event.data)); } catch (error) { console.error('消息解析错误:', error); } };
                    this.ws.onclose = () => {
                        this.ws = null;
                        if (this._intentionalClose) {
                            statusEl.textContent = '未连接'; statusEl.style.color = '#f44336';
                            this.resetRoom();
                        } else if (this.serverIp) {
                            // 非主动断开 → 3 秒后自动重连
                            statusEl.textContent = '连接断开'; statusEl.style.color = '#f44336';
                            this._reconnectTimer = setTimeout(() => {
                                if (!this._intentionalClose && !this.ws && this.serverIp) {
                                    this.openSocket(this.serverIp, this.serverPort, true);
                                }
                            }, 3000);
                        }
                    };
                    this.ws.onerror = (error) => { console.error('WebSocket错误:', error); };
                } catch (error) { console.error('WebSocket连接失败:', error); this.game.connectionStatus.textContent = '连接失败'; this.game.connectionStatus.style.color = '#f44336'; }
            }

            disconnectServer() {
                this._intentionalClose = true;
                clearTimeout(this._reconnectTimer);
                if (this.ws) { this.ws.close(); this.ws = null; }
                else if (!this.serverIp) { alert('未连接到服务器'); return; }
                this.resetRoom();
                this.game.connectionStatus.textContent = '未连接'; this.game.connectionStatus.style.color = '#f44336';
                this.serverIp = null; this.serverPort = null;
            }

            createRoom() {
                if (this.roomState === 'joiner') { this.leaveRoom(); return; }
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.sendWs({ type: 'create_room' });
                } else {
                    // 首次需先建连，连接成功后自动发送
                    this.connectToServer(() => this.sendWs({ type: 'create_room' }));
                }
            }

            joinRoom() {
                if (this.roomState === 'creator') { this.closeRoom(); return; }
                const roomId = this.game.roomIdInput.value.trim();
                if (!roomId) { alert('请输入房间ID'); return; }
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.sendWs({ type: 'join_room', roomId: roomId });
                } else {
                    // 首次需先建连，连接成功后自动发送
                    this.connectToServer(() => this.sendWs({ type: 'join_room', roomId: roomId }));
                }
            }

            closeRoom() {
                this.sendWs({ type: 'close_room' });
                this.resetRoom();
            }

            leaveRoom() {
                this.sendWs({ type: 'leave_room' });
                this.resetRoom();
            }

            // 统一的 WebSocket 发送入口（未连接时不发送）
            sendWs(obj) {
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    this.ws.send(JSON.stringify(obj));
                    return true;
                }
                return false;
            }

            sendGameAction(action) { this.sendWs({ type: 'game_action', action: action }); }

            handleWebSocketMessage(data) {
                switch (data.type) {
                    case 'room_created':
                        this.roomState = 'creator';
                        this.isHost = true;
                        this.roomId = data.roomId;
                        this.updateRoomButtonsState();
                        this.game.roomIdInput.value = data.roomId; this.game.roomIdInput.disabled = true; this.game.gameStatus.textContent = '等待对手加入';
                        this.game.playerRole.textContent = '房主（等待对手）';
                        alert(`房间创建成功！房间ID: ${data.roomId}`);
                        break;
                    case 'room_joined':
                        this.roomState = data.isHost ? 'creator' : 'joiner';
                        this.isHost = data.isHost;
                        this.roomId = data.roomId;
                        this.game.roomIdInput.value = data.roomId; this.game.roomIdInput.disabled = true;
                        if (data.role) {
                            // 断线重连已恢复原角色，直接显示身份
                            this.playerRole = data.role; this.isNetworkGame = true; this.updateRoleDisplay();
                        }
                        this.updateRoomButtonsState();
                        this.game.gameStatus.textContent = '游戏准备中';
                        if (!data.role) {
                            // 初次加入（角色待分配/同步）
                            this.game.playerRole.textContent = this.isHost ? '房主（重新加入）' : '客人（等待同步）';
                        }
                        break;
                    case 'player_joined':
                        this.game.gameStatus.textContent = '游戏准备中'; alert('对手已加入');
                        break;
                    case 'opponent_disconnected':
                        this.opponentGone = true;
                        this.game.gameStatus.textContent = '对手已断线，等待重连...';
                        break;
                    case 'player_rejoined':
                        this.opponentGone = false;
                        this.game.gameStatus.textContent = '对手已重连';
                        alert('对手已重连');
                        break;
                    case 'game_start': this.handleGameStart(data); break;
                    case 'game_action': this.handleGameAction(data); break;
                    case 'sync_request':
                        this.sendWs({ type: 'sync_response', history: this.game.state.history, isMyTurn: !this.isMyTurn });
                        this.game.gameStatus.textContent = this.isMyTurn ? '轮到你' : '等待对手';
                        break;
                    case 'sync_state': this.handleSyncState(data); break;
                    case 'player_left':
                        alert(data.message || '对手离开了游戏');
                        this.resetRoom();
                        this.game.gameStatus.textContent = '对手离开';
                        break;
                    case 'error':
                        if (data.message === '房间不存在') {
                            // 房间已过期（断线重连超时），停止恢复房间
                            this.resetRoom();
                            this.game.gameStatus.textContent = '房间已失效';
                            break;
                        }
                        alert('错误: ' + data.message);
                        break;
                    default: break;
                }
            }

            handleGameStart(data) {
                this.playerRole = data.role;
                this.isNetworkGame = true;
                this.updateRoleDisplay();
                if (data.role === 'first_player') { this.isMyTurn = true; alert('你是先手，请开始游戏'); } else {
                    this.isMyTurn = false; alert('你是后手，等待先手操作');
                }
                this.game.gameStatus.textContent = this.isMyTurn ? '轮到你' : '等待对手';
            }

            handleRequestReply(msg, replyOpt, onAgree, extraReplyFields = {}) {
                if (confirm(msg)) {
                    this.sendGameAction({ opt: replyOpt, reply: true, ...extraReplyFields });
                    onAgree();
                } else {
                    this.sendGameAction({ opt: replyOpt, reply: false });
                }
            }

            handleGameAction(data) {
                const action = data.action;
                switch (action.opt) {
                    case 'mainX': case 'mainO': case 'subX': case 'subO': this.game.actionProcessor.processBuild(action.x, action.y, true); this.isMyTurn = false; this.game.recorder.updateDisplay(true); break;
                    case 'layX': this.game.actionProcessor.processLay(action.x, action.y, true); this.isMyTurn = false; this.game.recorder.updateDisplay(true); break;
                    case 'layO': this.game.actionProcessor.processLay(action.x, action.y, true); this.isMyTurn = true; this.game.recorder.updateDisplay(true); break;
                    case 'choose': this.game.actionProcessor.processChoose(action.x, action.y, true); this.isMyTurn = false; this.game.recorder.updateDisplay(true); break;
                    case 'x-place': case 'o-place': this.game.actionProcessor.processPlace(action.x, action.y, true); this.isMyTurn = true; this.game.recorder.updateDisplay(true); break;
                    case 'x-eat': case 'o-eat': this.game.actionProcessor.processEat(action.x, action.y, true); this.isMyTurn = true; this.game.recorder.updateDisplay(true); break;
                    case 'resources':
                        this.game.actionProcessor.processResources(action.resources);
                        break;
                    case 'res':
                        this.game.actionProcessor.processResourceEdit(action.x, action.y, 'resource');
                        break;
                    case 'eptRes':
                        this.game.actionProcessor.processResourceEdit(action.x, action.y, 'empty');
                        break;
                    case 'select': this.game.actionProcessor.processSelect(action.x, action.y); this.isMyTurn = false; break;
                    case 'undo':
                        this.handleRequestReply('对手请求悔棋，是否同意？', 'undo-reply',
                            () => { this.game.performUndo(action.historyLength - 1); this.isMyTurn = false; },
                            { historyLength: action.historyLength });
                        break;
                    case 'undo-reply':
                        if (action.reply) { this.game.performUndo(action.historyLength - 1); this.isMyTurn = true; this.game.recorder.updateDisplay(true); } else { alert('对手拒绝悔棋'); }
                        break;
                    case 'restart':
                        this.handleRequestReply('对手请求重新开局，是否同意？', 'restart-reply',
                            () => { this.game.init(); this.isMyTurn = this.playerRole === 'first_player'; this.game.recorder.updateDisplay(true); });
                        break;
                    case 'restart-reply':
                        if (action.reply) { this.game.init(); this.isMyTurn = this.playerRole === 'first_player'; this.game.recorder.updateDisplay(true); } else { alert('对手拒绝重新开局'); }
                        break;
                    case 'calculate':
                        this.handleRequestReply('对手请求结算胜负，是否同意？', 'calculate-reply',
                            () => { this.game.actionProcessor.calculateEndgame(); });
                        break;
                    case 'calculate-reply':
                        if (action.reply) { this.game.actionProcessor.calculateEndgame(); } else { alert('对手拒绝结算胜负'); }
                        break;
                    case 'export':
                        this.handleRequestReply('对手请求导出棋局，是否同意？', 'export-reply',
                            () => { this.game.fileManager.performExport(); });
                        break;
                    case 'export-reply':
                        if (action.reply) { this.game.fileManager.performExport(); } else { alert('对手拒绝导出棋局'); }
                        break;
                }
                this.game.renderer.flashAction(action, true);
                this.game.gameStatus.textContent = this.isMyTurn ? '轮到你' : '等待对手';
            }

            handleSyncState(data) {
                if (data.history) { this.game.state.history = data.history; this.game.replayHistory(this.game.state.history.length - 1); }
                if (data.isMyTurn !== undefined) this.isMyTurn = data.isMyTurn;
                this.isNetworkGame = true;
                this.game.recorder.renderFullHistory();
                this.game.renderer.initBoard(); this.game.renderer.drawBoard();
                this.game.recorder.updateDisplay();
            }
        }

        // 创建全局游戏实例
        let game;
        window.onload = function() {
            game = new Game();
        };
    </script>
</body>
</html>
